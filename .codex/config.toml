# Project-scoped role registry. The 0.137.0 project-config schema treats
# [agents] as named roles; global concurrency settings belong to user config.
default_permissions = "stage715-read-only-loopback"

[features]
multi_agent = true
network_proxy = true

[permissions.stage715-read-only-loopback]
extends = ":read-only"

[permissions.stage715-read-only-loopback.network]
enabled = true
mode = "limited"
allow_local_binding = true

[agents]
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

[agents.explorer]
config_file = "agents/explorer.toml"

[agents.tester]
config_file = "agents/tester.toml"

[agents.researcher]
config_file = "agents/researcher.toml"

[agents.reviewer]
config_file = "agents/reviewer.toml"

[agents.critical_reviewer]
config_file = "agents/critical_reviewer.toml"
