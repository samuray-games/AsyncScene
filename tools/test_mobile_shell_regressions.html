<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile shell regression runner</title>
  <style>
    body{font:14px/1.4 system-ui,sans-serif;margin:12px;color:#17202a}
    #report{white-space:pre-wrap;margin:10px 0;padding:10px;border:1px solid #8795a1;border-radius:8px}
    #appFrame{display:block;border:1px solid #7a8790;max-width:none;max-height:none}
    .pass{color:#126b35}.fail{color:#ad1d1d}
    body.show-fixture-only{margin:0;padding:0;width:390px;overflow:hidden}
    body.show-fixture-only h1,body.show-fixture-only #identity,body.show-fixture-only #report{display:none}
    body.show-fixture-only #appFrame{transform:scale(.82);transform-origin:top left;border:0}
  </style>
</head>
<body>
  <h1>Mobile shell regression runner</h1>
  <p id="identity">Initializing Codex Browser viewport fixtures…</p>
  <pre id="report" aria-live="polite">RUNNING</pre>
  <iframe id="appFrame" title="Asynchronia viewport fixture"></iframe>
  <script>
  (() => {
    const sizes = [
      [320,568,"mobile"],[360,640,"mobile"],[390,844,"mobile"],[430,932,"mobile"],
      [768,1024,"tablet"],[1280,720,"desktop"],[1440,900,"desktop"],
    ];
    const params = new URLSearchParams(location.search);
    const requestedView = params.get("view");
    document.body.classList.toggle("show-fixture-only", requestedView !== null);
    const selectedRuns = requestedView === null
      ? sizes.map((size,index) => [index,size])
      : [[Number(requestedView),sizes[Number(requestedView)]]].filter((entry) => entry[1]);
    const report = document.getElementById("report");
    const identity = document.getElementById("identity");
    const frame = document.getElementById("appFrame");
    const results = [];
    const runId = params.get("run") || String(Date.now());
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const assert = (condition, code, details) => ({pass:!!condition,code,details:details||""});
    const rect = (node) => {
      const value = node && node.getBoundingClientRect();
      return value ? {x:Math.round(value.x),y:Math.round(value.y),width:Math.round(value.width),height:Math.round(value.height)} : null;
    };
    const dispatchDrag = (target,start,end,pointerId) => {
      const common = {bubbles:true,cancelable:true,pointerId:pointerId,pointerType:"touch",button:0,isPrimary:true};
      target.dispatchEvent(new PointerEvent("pointerdown",Object.assign({},common,{clientX:start[0],clientY:start[1]})));
      target.dispatchEvent(new PointerEvent("pointermove",Object.assign({},common,{clientX:end[0],clientY:end[1]})));
      target.dispatchEvent(new PointerEvent("pointerup",Object.assign({},common,{clientX:end[0],clientY:end[1]})));
    };
    const loadSize = async ([width,height,kind],index) => {
      frame.style.width = width + "px";
      frame.style.height = height + "px";
      await new Promise((resolve) => {
        frame.onload = resolve;
        frame.onerror = resolve;
        frame.src = new URL("/AsyncScene/index.html?mobileShellRegression=" + index,location.origin).href;
      });
      await wait(250);
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const game = win && win.Game;
      const ui = game && game.UI;
      const mobileInterface = game && game.__DEV && game.__DEV.mobileInterface;
      if (doc && !doc.querySelector('link[data-mobile-regression-style="' + index + '"]')) {
        await new Promise((resolve) => {
          const freshStyle = doc.createElement("link");
          freshStyle.rel = "stylesheet";
          freshStyle.dataset.mobileRegressionStyle = String(index);
          freshStyle.href = "/AsyncScene/style-base.css?mobileShellRegressionStyle=" + runId + "-" + index;
          freshStyle.onload = resolve;
          freshStyle.onerror = resolve;
          doc.head.appendChild(freshStyle);
        });
        if (ui && ui.ensureMobilePinnedChatLayout) ui.ensureMobilePinnedChatLayout();
      }
      const state = game && game.__S;
      const uiInitialState = ui ? {
        activeTab:mobileInterface && mobileInterface.getActiveTab ? mobileInterface.getActiveTab() : "dm",
        dmOpen:state && state.dm ? state.dm.open : undefined,
        menuOpen:state && state.flags ? state.flags.menuOpen : undefined,
        battleInvite:ui._battleInvite ? Object.assign({},ui._battleInvite) : undefined,
      } : {};
      const initialFlags = state && state.flags ? {
        stage715Demo:state.flags.stage715Demo,
        manifestOpen:state.flags.manifestOpen,
      } : {};
      const tabs = doc && doc.getElementById("mobilePanelTabs");
      const shell = doc && doc.getElementById("mobilePanelShell");
      const top = doc && doc.getElementById("topBar");
      const menuButton = doc && doc.getElementById("btnMenu");
      const chat = doc && doc.getElementById("left");
      const blocks = doc && doc.getElementById("blocks");
      const handle = doc && doc.getElementById("chatResizeHandle");
      const mobile = width <= 860;
      const stageLocked = doc && doc.documentElement.classList.contains("stage7-first-experience-active");
      if (stageLocked && doc && mobileInterface) {
        doc.documentElement.classList.remove("stage7-first-experience-active");
        mobileInterface.selectTab("dm",false);
        if (ui.ensureMobilePinnedChatLayout) ui.ensureMobilePinnedChatLayout();
      }
      const checks = [];
      const bounds = {top:rect(top),menu:rect(menuButton),chat:rect(chat),tabs:rect(tabs),shell:rect(shell),lower:rect(blocks),splitter:rect(handle)};
      const dims = {width:win && win.innerWidth,height:win && win.innerHeight,scrollWidth:doc && doc.documentElement.scrollWidth};
      checks.push(assert(!!game && !!ui && !!mobileInterface,"app_booted"));
      checks.push(assert(dims.width === width && dims.height === height,"fixture_viewport_exact",JSON.stringify(dims)));
      checks.push(assert(dims.scrollWidth <= width,"no_horizontal_overflow",dims.scrollWidth + "/" + width));
      if (mobile) {
        const buttons = Array.from(tabs ? tabs.querySelectorAll('[role="tab"]') : []);
        checks.push(assert(tabs && win.getComputedStyle(tabs).display !== "none" && bounds.tabs.height >= 40,"three_tabs_visible",JSON.stringify(bounds.tabs)));
        checks.push(assert(buttons.length === 3,"exactly_three_tabs",String(buttons.length)));
        checks.push(assert(tabs && tabs.getAttribute("role") === "tablist","tablist_accessible"));
        checks.push(assert(top && bounds.top.height > 0 && win.getComputedStyle(top).display !== "none","topbar_visible",JSON.stringify(bounds.top)));
        checks.push(assert(menuButton && bounds.menu.height > 0 && bounds.menu.x >= 0 && bounds.menu.x + bounds.menu.width <= width,"menu_button_visible_inside_viewport",JSON.stringify(bounds.menu)));
        checks.push(assert(chat && bounds.chat.height > 0 && win.getComputedStyle(chat).display !== "none","chat_visible",JSON.stringify(bounds.chat)));
        checks.push(assert(handle && win.getComputedStyle(handle).display !== "none" && bounds.splitter.height >= 16,"splitter_visible",JSON.stringify(bounds.splitter)));
        const labels = buttons.map((button) => button.querySelector("span") ? button.querySelector("span").textContent.trim() : "");
        checks.push(assert(labels[0] === "Личка" && labels[2] === "События" && labels[1].length > 0,"tab_order_and_labels",labels.join("|")));
        checks.push(assert(mobileInterface.getActiveTab() === "dm","initial_tab_is_dm",mobileInterface.getActiveTab()));
        const counterSources = ["dmHeaderCount","battleCount","eventsHeaderCount"];
        const counterMatches = buttons.every((button,index) => {
          const source = doc.getElementById(counterSources[index]);
          const sourceDigits = String(source && source.textContent || "").match(/-?\d+/);
          const badge = button.querySelector('[data-mobile-count="' + ["dm","battles","events"][index] + '"]');
          return badge && badge.textContent === (sourceDigits ? String(Math.max(0,Number.parseInt(sourceDigits[0],10)||0)) : "0");
        });
        checks.push(assert(counterMatches,"tab_counts_follow_existing_sources"));
        const sourceSnapshots = counterSources.map((id) => {
          const node = doc.getElementById(id);
          return node ? {node:node,text:node.textContent} : null;
        });
        sourceSnapshots.forEach((snapshot) => {if (snapshot) snapshot.node.textContent = " (9) ";});
        mobileInterface.updateCounters();
        const countersRefresh = buttons.every((button,index) => button.querySelector('[data-mobile-count="' + ["dm","battles","events"][index] + '"]')?.textContent === "9");
        sourceSnapshots.forEach((snapshot) => {if (snapshot) snapshot.node.textContent = snapshot.text;});
        mobileInterface.updateCounters();
        checks.push(assert(countersRefresh,"tab_counts_refresh_from_existing_sources"));

        const refs = {chat:state.chat,battles:state.battles,events:state.events,dmLogs:state.dm.logs};
        buttons[1].click();
        checks.push(assert(mobileInterface.getActiveTab() === "battles" && buttons[1].getAttribute("aria-selected") === "true","single_tap_switches_tab",mobileInterface.getActiveTab()));
        const gameEntitiesPreserved = state.chat === refs.chat && state.battles === refs.battles && state.events === refs.events && state.dm.logs === refs.dmLogs;
        checks.push(assert(gameEntitiesPreserved,"gameplay_entity_state_preserved"));

        const keyboardStart = buttons[0];
        keyboardStart.focus();
        keyboardStart.dispatchEvent(new KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true,cancelable:true}));
        checks.push(assert(mobileInterface.getActiveTab() === "battles" && doc.activeElement === buttons[1],"arrow_key_navigation"));

        buttons[1].click();
        const inviteButton = doc.querySelector("#battlesBody .actions button");
        if (inviteButton) {
          inviteButton.click();
          await wait(40);
          checks.push(assert(!!doc.getElementById("battleInviteInput"),"game_action_entry_opens_on_first_click"));
          if (ui._battleInvite) ui._battleInvite.open = false;
          if (ui.renderBattles) ui.renderBattles();
        } else checks.push(assert(false,"game_action_entry_available"));

        const scrollBody = doc.getElementById("battlesBody");
        if (scrollBody && scrollBody.scrollHeight > scrollBody.clientHeight + 1) {
          scrollBody.scrollTop = Math.min(48,scrollBody.scrollHeight-scrollBody.clientHeight);
          const savedScrollTop = scrollBody.scrollTop;
          buttons[2].click();
          buttons[1].click();
          checks.push(assert(scrollBody.scrollTop === savedScrollTop,"panel_scroll_position_preserved",scrollBody.scrollTop + "/" + savedScrollTop));
        } else checks.push(assert(true,"panel_scroll_position_preserved","no overflow content in this fixture"));
        const battleBody = doc.getElementById("battlesBody");
        mobileInterface.selectTab("battles",false);
        dispatchDrag(battleBody,[Math.round(width*.75),Math.round(height*.6)],[Math.round(width*.35),Math.round(height*.6)+2],101);
        checks.push(assert(mobileInterface.getActiveTab() === "events","horizontal_swipe_switches_tab",mobileInterface.getActiveTab()));
        mobileInterface.selectTab("battles",false);
        dispatchDrag(battleBody,[Math.round(width*.5),Math.round(height*.6)],[Math.round(width*.5)+4,Math.round(height*.6)+90],102);
        checks.push(assert(mobileInterface.getActiveTab() === "battles","vertical_drag_does_not_switch",mobileInterface.getActiveTab()));
        dispatchDrag(buttons[0],[width-35,Math.round(height*.6)],[width-110,Math.round(height*.6)],103);
        checks.push(assert(mobileInterface.getActiveTab() === "battles","interactive_tab_drag_not_intercepted",mobileInterface.getActiveTab()));

        const chatBefore = chat.getBoundingClientRect().height;
        dispatchDrag(handle,[Math.round(width*.5),Math.round(chat.getBoundingClientRect().bottom-8)],[Math.round(width*.5),Math.round(chat.getBoundingClientRect().bottom+28)],104);
        const chatAfter = chat.getBoundingClientRect().height;
        const chatMin = Number.parseFloat(win.getComputedStyle(doc.documentElement).getPropertyValue("--mobile-chat-min")) || 0;
        const panelHeight = Number.parseFloat(win.getComputedStyle(doc.documentElement).getPropertyValue("--mobile-panels-height")) || 0;
        checks.push(assert(chatAfter !== chatBefore,"splitter_drag_changes_chat_height",Math.round(chatBefore) + "->" + Math.round(chatAfter)));
        checks.push(assert(chatAfter >= chatMin && panelHeight >= 88,"splitter_minimum_heights",Math.round(chatAfter) + "/" + chatMin + "; panels=" + panelHeight));

        const originalVV = Object.getOwnPropertyDescriptor(win,"visualViewport");
        let keyboardResponsive = false;
        let keyboardMenuAccessible = false;
        let keyboardRestore = false;
        let keyboardBaseline = null;
        let keyboardMenuStart = false;
        try {
          if (index === 0) {
            ui.hideMenu();
            ui.ensureMobilePinnedChatLayout();
            keyboardBaseline = {
              chat:Math.round(chat.getBoundingClientRect().height),
              panels:Math.round(shell.getBoundingClientRect().height),
            };
            ui.showMenu();
            const chatInput = doc.getElementById("chatInput");
            chatInput.focus();
            keyboardMenuStart = doc.getElementById("menuBlock").classList.contains("menu-open")
              && doc.activeElement === chatInput;
          }
          Object.defineProperty(win,"visualViewport",{configurable:true,value:{height:Math.max(240,height-180),offsetTop:24,addEventListener:function(){}}});
          ui.ensureMobilePinnedChatLayout();
          const vvHeight = Number.parseFloat(doc.documentElement.style.getPropertyValue("--mobile-vv-height")) || 0;
          const vvTop = Number.parseFloat(doc.documentElement.style.getPropertyValue("--mobile-vv-top")) || 0;
          keyboardResponsive = doc.body.classList.contains("mobile-keyboard-open")
            && vvHeight === Math.max(240,height-180) && vvTop === 24
            && (Number.parseFloat(doc.documentElement.style.getPropertyValue("--mobile-chat-min")) || 0) >= 72;
          if (index === 0) {
            const chatInput = doc.getElementById("chatInput");
            const chatLog = doc.getElementById("chatLog");
            const panelBody = doc.querySelector("#blocks > .panel:not(.hidden) .panelBody:not(.hidden), #blocks > .panel:not(.hidden) #battlesBody:not(.hidden), #blocks > .panel:not(.hidden) #eventsBody:not(.hidden)");
            const menuClosedForSpace = !doc.getElementById("menuBlock").classList.contains("menu-open");
            const viewBottom = vvTop + vvHeight;
            const inputRect = chatInput.getBoundingClientRect();
            const logRect = chatLog.getBoundingClientRect();
            const shellRect = shell.getBoundingClientRect();
            const panelBodyHeight = panelBody ? panelBody.getBoundingClientRect().height : 0;
            keyboardMenuAccessible = keyboardMenuStart && menuClosedForSpace
              && doc.activeElement === chatInput
              && inputRect.height > 0 && inputRect.top >= vvTop && inputRect.bottom <= viewBottom
              && logRect.height > 0 && logRect.top >= vvTop && logRect.bottom <= viewBottom
              && shellRect.height >= 112 && shellRect.top >= vvTop && shellRect.bottom <= viewBottom
              && panelBodyHeight > 0;
          }
        } catch (_) {}
        if (originalVV) Object.defineProperty(win,"visualViewport",originalVV);
        else delete win.visualViewport;
        ui.ensureMobilePinnedChatLayout();
        checks.push(assert(keyboardResponsive,"visual_viewport_keyboard_compaction"));
        if (index === 0) {
          const afterKeyboardClose = {
            chat:Math.round(chat.getBoundingClientRect().height),
            panels:Math.round(shell.getBoundingClientRect().height),
          };
          const chatInput = doc.getElementById("chatInput");
          chatInput.blur();
          ui.showMenu();
          const menuOpenSize = Math.round(chat.getBoundingClientRect().height);
          ui.hideMenu();
          ui.ensureMobilePinnedChatLayout();
          const restored = {
            chat:Math.round(chat.getBoundingClientRect().height),
            panels:Math.round(shell.getBoundingClientRect().height),
          };
          keyboardRestore = !doc.body.classList.contains("mobile-keyboard-open")
            && Math.abs(afterKeyboardClose.chat-keyboardBaseline.chat) <= 2
            && Math.abs(afterKeyboardClose.panels-keyboardBaseline.panels) <= 2
            && menuOpenSize > 0
            && Math.abs(restored.chat-keyboardBaseline.chat) <= 2
            && Math.abs(restored.panels-keyboardBaseline.panels) <= 2;
          checks.push(assert(keyboardMenuAccessible,"short_keyboard_menu_focus_geometry",JSON.stringify({input:rect(chatInput),chat:rect(chat),shell:rect(shell)})));
          checks.push(assert(keyboardRestore,"keyboard_and_menu_close_restore_sizes",JSON.stringify({baseline:keyboardBaseline,afterKeyboardClose,restored,menuOpenSize})));
        }

        const hintTarget = doc.querySelector("#balance [data-stat-hover-hint]");
        if (hintTarget) {
          const common = {bubbles:true,cancelable:true,pointerId:201,pointerType:"touch",button:0,isPrimary:true,clientX:10,clientY:10};
          hintTarget.dispatchEvent(new PointerEvent("pointerdown",common));
          hintTarget.dispatchEvent(new PointerEvent("pointerup",common));
          hintTarget.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true}));
          const hint = doc.getElementById("mobileLongPressHint");
          const shortTapNoHint = !hint || hint.getAttribute("aria-hidden") === "true";
          const hold = Object.assign({},common,{pointerId:202});
          hintTarget.dispatchEvent(new PointerEvent("pointerdown",hold));
          await wait(560);
          hintTarget.dispatchEvent(new PointerEvent("pointerup",hold));
          hintTarget.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true}));
          const shownHint = doc.getElementById("mobileLongPressHint");
          checks.push(assert(shortTapNoHint,"short_stat_tap_does_not_open_hint"));
          checks.push(assert(shownHint && shownHint.classList.contains("is-visible") && shownHint.getAttribute("aria-hidden") === "false" && hintTarget.getAttribute("aria-describedby") === shownHint.id,"long_press_opens_accessible_hint"));
          doc.body.dispatchEvent(new PointerEvent("pointerdown",Object.assign({},common,{pointerId:203})));
        } else checks.push(assert(false,"stat_hint_target_available"));

        if (index === 2) {
          const menuBlock = doc.getElementById("menuBlock");
          if (menuButton && win.getComputedStyle(menuButton).display !== "none") {
            ui.hideMenu();
            menuButton.click();
            await wait(40);
            const menuOpened = doc.getElementById("menuBlock").classList.contains("menu-open");
            checks.push(assert(menuOpened,"menu_opens"));
            if (menuOpened && doc.getElementById("btnManifestToggle")) {
              const goalButton = doc.getElementById("btnManifestToggle");
              goalButton.click();
              const goal = doc.getElementById("manifestBody");
              const openHeightA = goal && Math.round(goal.getBoundingClientRect().height);
              const oldCopy = goal && goal.textContent;
              if (goal) {
                goal.textContent = "Создай свою историю в Асинхронии. Вступай в конфликты, выбирай, кого поддерживать, и решай, чего добиваться.";
                const openHeightB = Math.round(goal.getBoundingClientRect().height);
                goal.textContent = oldCopy;
                checks.push(assert(openHeightA > 0 && openHeightB > 0 && win.getComputedStyle(goal).flex === "0 0 auto","goal_body_visible_for_copy_lengths",JSON.stringify({openHeightA,openHeightB,flex:win.getComputedStyle(goal).flex})));
              } else checks.push(assert(false,"goal_block_available"));
            }
            menuButton.click();
            await wait(40);
            checks.push(assert(!menuBlock.classList.contains("menu-open"),"menu_closes"));
          } else checks.push(assert(false,"menu_button_available"));
          state.flags = state.flags || {};
          state.flags.stage715Demo = true;
          state.flags.manifestOpen = false;
          ui.renderMenu();
          doc.documentElement.classList.add("stage7-first-experience-active");
          const goal = doc.getElementById("manifestBody");
          const goalClosed = goal && goal.hidden && goal.getAttribute("aria-hidden") === "true";
          const goalParentHidden = menuBlock && win.getComputedStyle(menuBlock).display === "none";
          const closedHeight = goal && Math.round(goal.getBoundingClientRect().height);
          state.flags.manifestOpen = true;
          ui.showMenu();
          ui.renderMenu();
          const openWhileLocked = goal && !goal.hidden && goal.getAttribute("aria-hidden") === "false";
          const lockedHeight = goal && Math.round(goal.getBoundingClientRect().height);
          checks.push(assert(goalClosed && goalParentHidden && closedHeight === 0 && openWhileLocked && lockedHeight === 0,"onboarding_lock_keeps_goal_panel_hidden",JSON.stringify({closedHeight,lockedHeight})));
          ui.hideMenu();
          doc.documentElement.classList.remove("stage7-first-experience-active");
          state.flags.stage715Demo = initialFlags.stage715Demo;
          state.flags.manifestOpen = initialFlags.manifestOpen;
          ui.renderMenu();
        }
        if (state.dm && uiInitialState.dmOpen !== undefined) {
          state.dm.open = uiInitialState.dmOpen;
          ui.renderDM();
        }
        state.flags = state.flags || {};
        state.flags.menuOpen = !!uiInitialState.menuOpen;
        if (ui._battleInvite && ui._battleInvite._clickOutsideHandler) doc.removeEventListener("click",ui._battleInvite._clickOutsideHandler,true);
        if (ui._battleInvite && ui._battleInvite._clickOutsideTimer) clearTimeout(ui._battleInvite._clickOutsideTimer);
        const orphanInviteDropdown = doc.getElementById("battleInviteDropdown");
        if (orphanInviteDropdown) orphanInviteDropdown.remove();
        ui._battleInvite = uiInitialState.battleInvite;
        if (ui.renderBattles) ui.renderBattles();
        mobileInterface.selectTab(uiInitialState.activeTab || "dm",false);
        if (uiInitialState.menuOpen) ui.showMenu(); else ui.hideMenu();
        ui.ensureMobilePinnedChatLayout();
      } else {
        checks.push(assert(tabs && win.getComputedStyle(tabs).display === "none","desktop_tab_strip_hidden"));
        checks.push(assert(shell && win.getComputedStyle(shell).display === "contents","desktop_panels_keep_flow"));
        checks.push(assert(chat && top && bounds.chat.height > 0 && bounds.top.height > 0,"desktop_chat_and_topbar_visible"));
        checks.push(assert(!handle || win.getComputedStyle(handle).display === "none","desktop_splitter_hidden"));
      }
      const failures = checks.filter((item) => !item.pass);
      results.push({size:width + "x" + height,kind:kind,passed:checks.length-failures.length,total:checks.length,failures:failures,checks:checks,bounds:bounds,dims:dims});
      report.textContent = results.map((result) => (result.passed===result.total?"PASS":"FAIL") + " " + result.size + " " + result.kind + ": " + result.passed + "/" + result.total + (result.failures.length ? "\n  " + result.failures.map((item) => item.code + " " + item.details).join("\n  ") : "")).join("\n");
      report.className = failures.length ? "fail" : "pass";
      identity.textContent = "Codex Browser fixture " + width + "×" + height + "; exact iframe viewport " + dims.width + "×" + dims.height + "; app " + frame.contentDocument.title;
      frame.contentWindow.scrollTo(0,0);
      await wait(80);
    };
    (async () => {
      for (const [index,size] of selectedRuns) await loadSize(size,index);
      const total = results.reduce((sum,item) => sum + item.total,0);
      const passed = results.reduce((sum,item) => sum + item.passed,0);
      report.textContent += "\n\nTOTAL " + passed + "/" + total + " " + (passed===total?"PASS":"FAIL");
      identity.textContent = "Finished " + results.length + " exact-size Codex Browser iframe runs. " + results.map((item) => item.size + " " + item.passed + "/" + item.total).join("; ");
      frame.title = "Asynchronia viewport fixture: " + report.textContent.replace(/\n/g," | ");
    })().catch((error) => {
      report.className = "fail";
      report.textContent += "\n\nRUNNER ERROR " + (error && error.stack || error);
    });
  })();
  </script>
</body>
</html>
