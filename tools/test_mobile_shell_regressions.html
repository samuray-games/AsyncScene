              const balanceScroll={required:balanceNeedsScroll,topBefore:Math.round(balanceScrollStart),topAfter:Math.round(balanceAtEnd),max:Math.max(0,balance.scrollWidth-balance.clientWidth)};
              balance.scrollLeft=balanceScrollStart;
              const balanceAccessible=firstStatReachable&&lastStatReachable&&(!balanceNeedsScroll||balanceScroll.max>0);
              const chatInputVisible=inputId!=="chatInput"||(inputRect.top>=visibleTop&&inputRect.bottom<=visibleBottom&&isInside(input,chat)&&isInside(chatInputRow,chat));
              const activeInputVisible=inputRect.height>0&&inputRect.top>=visibleTop&&inputRect.bottom<=visibleBottom
                &&(inputId==="chatInput"?isInside(input,chat):isInside(input,panelBody));
              const topbarCompact=topRect.height>0&&topRect.height<=104
                &&menuButtonRect&&menuButtonRect.top>=visibleTop&&menuButtonRect.bottom<=visibleBottom
                &&menuButtonRect.left>=topRect.left&&menuButtonRect.right<=topRect.right
                &&isInside(menuButton,top);
              const shellAndTabsVisible=shellRect.height>=112&&shellRect.top>=visibleTop&&shellRect.bottom<=visibleBottom
                &&tabsRect.height>=36&&tabsRect.top>=shellRect.top&&tabsRect.bottom<=shellRect.bottom
                &&(inputId==="chatInput"||(dmPanel.getBoundingClientRect().height>0&&isInside(dmPanel,shell)&&isInside(panelBody,dmPanel)));
              const chatAreaUsable=leftRect.height>=72&&leftRect.top>=visibleTop&&leftRect.bottom<=visibleBottom
                &&leftRect.height>=keyboardMin&&nodeState(chatInputRow,win).rect.height>0&&isInside(chatInputRow,chat)
                &&chatInput.getBoundingClientRect().height>0
                &&(inputId!=="chatInput"||chatInputVisible)
                &&chatLogState.clientHeight>0&&(chatLogState.overflowY==="auto"||chatLogState.overflowY==="scroll")&&chatLogScrollable;
              const dmLogAccessible=inputId==="chatInput"||!!(panelScroll.required&&panelScroll.moved&&logScroll.insidePanel);
              const panelScrollValid=inputId==="chatInput"||(!panelScroll.required||panelScroll.moved||activeInputVisible);
              const geometryAccessible=menuStartedOpen&&menuClosedForSpace&&doc.activeElement===input&&!input.disabled
                &&activeInputVisible&&topbarCompact&&balanceAccessible&&shellAndTabsVisible&&chatAreaUsable&&dmLogAccessible&&panelScrollValid
                &&(inputId==="chatInput"||(!panelBody||panelBody.clientHeight>0));
              const label=inputId.replace(/[A-Z]/g,(letter)=>"_"+letter.toLowerCase());
              const inputs={chatInput,dmInput:doc.getElementById("dmInput"),reportInput:doc.getElementById("reportInput")};
              const topBarStyle=win.getComputedStyle(top);
              const evidence={menuStartedOpen,menuClosedForSpace,activeInputVisible,topbarCompact,topBarGrid:{columns:topBarStyle.gridTemplateColumns,rows:topBarStyle.gridTemplateRows,justify:topBarStyle.justifyContent,contentWidth:top.clientWidth},balanceAccessible,balanceScroll,statChips:statChips.map((node)=>rect(node)),shellAndTabsVisible,chatAreaUsable,chatLogScrollable,chatLogScroll,dmLogAccessible,logScroll,panelScroll,panelScrollValid,keyboardMin,diagnostic:diagnostic(win,doc,inputId,inputs)};
              keyboardFocusResults.push(assert(geometryAccessible,"short_keyboard_menu_focus_geometry_"+label,JSON.stringify(evidence)));
              keyboardFocusResults.push(assert(true,"keyboard_focus_case_completed_"+label,JSON.stringify({inputId,scenario:inputId==="reportInput"?"live cop report flow":inputId==="dmInput"?"live DM flow":"public chat composer"})));
              restoreVV();
              input.blur();
              ui.hideMenu();
              ui.ensureMobilePinnedChatLayout();
              mobileInterface.selectTab(previousTab,false);
              ui.ensureMobilePinnedChatLayout();
              const restored={chat:Math.round(chat.getBoundingClientRect().height),panels:Math.round(shell.getBoundingClientRect().height)};
              keyboardFocusResults.push(assert(Math.abs(restored.chat-baseline.chat)<=2&&Math.abs(restored.panels-baseline.panels)<=2,"keyboard_menu_size_restore_"+label,JSON.stringify({baseline,restored})));
              ui.showMenu();
              const menuAfter={open:menu.classList.contains("menu-open")&&win.getComputedStyle(menu).display!=="none"&&menu.getBoundingClientRect().height>0,rect:rect(menu)};
              keyboardFocusResults.push(assert(menuAfter.open,"menu_reopens_after_keyboard_"+label,JSON.stringify(menuAfter)));
              ui.hideMenu();
            }
          } catch (error) {
            restoreVV();
            keyboardFocusResults.push(assert(false,"keyboard_focus_scenarios_threw",String(error&&error.stack||error)));
          }
          restoreVV();
          if (ui._copReport&&ui._copReport._outsideHandler) doc.removeEventListener("click",ui._copReport._outsideHandler,true);
          const orphanReportDropdown=doc.getElementById("reportList");
          if (orphanReportDropdown) orphanReportDropdown.remove();
          state.dm=dmSnapshot;
          if (syntheticCop) delete state.players[syntheticCop.id];
          ui._copReport=copReportSnapshot||{open:false,q:"",sel:0,list:[],dropdownOpen:false};
          ui.renderDM();
          mobileInterface.selectTab(previousTab,false);
        } else {
          Object.defineProperty(win,"visualViewport",{configurable:true,value:reducedVV()});
          ui.ensureMobilePinnedChatLayout();
          const vvHeight=Number.parseFloat(doc.documentElement.style.getPropertyValue("--mobile-vv-height"))||0;
          const vvTop=Number.parseFloat(doc.documentElement.style.getPropertyValue("--mobile-vv-top"))||0;
          keyboardResponsive=doc.body.classList.contains("mobile-keyboard-open")&&vvHeight===Math.max(240,height-180)&&vvTop===24
            &&(Number.parseFloat(doc.documentElement.style.getPropertyValue("--mobile-chat-min"))||0)>=72;
          restoreVV();
        }
        checks.push(assert(keyboardResponsive,"visual_viewport_keyboard_compaction"));
        checks.push(...keyboardFocusResults);
        if(index===0){
          const completed=new Set(keyboardFocusResults.map((item)=>item.code));
          const missing=expectedFocusCodes.filter((code)=>!completed.has(code));
          checks.push(assert(missing.length===0,"all_keyboard_focus_cases_completed",JSON.stringify({expected:expectedFocusCodes.length,completed:completed.size,missing})));
        }
        const hintTarget = doc.querySelector("#balance [data-stat-hover-hint]");
        if (hintTarget) {
          const common = {bubbles:true,cancelable:true,pointerId:201,pointerType:"touch",button:0,isPrimary:true,clientX:10,clientY:10};
          hintTarget.dispatchEvent(new PointerEvent("pointerdown",common));
          hintTarget.dispatchEvent(new PointerEvent("pointerup",common));
          hintTarget.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true}));
          const hint = doc.getElementById("mobileLongPressHint");
          const shortTapNoHint = !hint || hint.getAttribute("aria-hidden") === "true";
          const hold = Object.assign({},common,{pointerId:202});
          hintTarget.dispatchEvent(new PointerEvent("pointerdown",hold));
          await wait(560);
          hintTarget.dispatchEvent(new PointerEvent("pointerup",hold));
          hintTarget.dispatchEvent(new MouseEvent("click",{bubbles:true,cancelable:true}));
          const shownHint = doc.getElementById("mobileLongPressHint");
          checks.push(assert(shortTapNoHint,"short_stat_tap_does_not_open_hint"));
          checks.push(assert(shownHint && shownHint.classList.contains("is-visible") && shownHint.getAttribute("aria-hidden") === "false" && hintTarget.getAttribute("aria-describedby") === shownHint.id,"long_press_opens_accessible_hint"));
          doc.body.dispatchEvent(new PointerEvent("pointerdown",Object.assign({},common,{pointerId:203})));
        } else checks.push(assert(false,"stat_hint_target_available"));

        if (index === 2) {
          const menuBlock = doc.getElementById("menuBlock");
          if (menuButton && win.getComputedStyle(menuButton).display !== "none") {
            ui.hideMenu();
            menuButton.click();
            await wait(40);
            const menuOpened = doc.getElementById("menuBlock").classList.contains("menu-open");
            checks.push(assert(menuOpened,"menu_opens"));
            if (menuOpened && doc.getElementById("btnManifestToggle")) {
              const goalButton = doc.getElementById("btnManifestToggle");
              goalButton.click();
              const goal = doc.getElementById("manifestBody");
              const openHeightA = goal && Math.round(goal.getBoundingClientRect().height);
              const oldCopy = goal && goal.textContent;
              if (goal) {
                goal.textContent = "Создай свою историю в Асинхронии. Вступай в конфликты, выбирай, кого поддерживать, и решай, чего добиваться.";
                const openHeightB = Math.round(goal.getBoundingClientRect().height);
                goal.textContent = oldCopy;
                checks.push(assert(openHeightA > 0 && openHeightB > 0 && win.getComputedStyle(goal).flex === "0 0 auto","goal_body_visible_for_copy_lengths",JSON.stringify({openHeightA,openHeightB,flex:win.getComputedStyle(goal).flex})));
              } else checks.push(assert(false,"goal_block_available"));
            }
            menuButton.click();
            await wait(40);
            checks.push(assert(!menuBlock.classList.contains("menu-open"),"menu_closes"));
          } else checks.push(assert(false,"menu_button_available"));
          state.flags = state.flags || {};
          state.flags.stage715Demo = true;
          state.flags.manifestOpen = false;
          ui.renderMenu();
          doc.documentElement.classList.add("stage7-first-experience-active");
          const goal = doc.getElementById("manifestBody");
          const goalClosed = goal && goal.hidden && goal.getAttribute("aria-hidden") === "true";
          const goalParentHidden = menuBlock && win.getComputedStyle(menuBlock).display === "none";
          const closedHeight = goal && Math.round(goal.getBoundingClientRect().height);
          state.flags.manifestOpen = true;
          ui.showMenu();
          ui.renderMenu();
          const openWhileLocked = goal && !goal.hidden && goal.getAttribute("aria-hidden") === "false";
          const lockedHeight = goal && Math.round(goal.getBoundingClientRect().height);
          checks.push(assert(goalClosed && goalParentHidden && closedHeight === 0 && openWhileLocked && lockedHeight === 0,"onboarding_lock_keeps_goal_panel_hidden",JSON.stringify({closedHeight,lockedHeight})));
          ui.hideMenu();
          doc.documentElement.classList.remove("stage7-first-experience-active");
          state.flags.stage715Demo = initialFlags.stage715Demo;
          state.flags.manifestOpen = initialFlags.manifestOpen;
          ui.renderMenu();
        }
        if (state.dm && uiInitialState.dmOpen !== undefined) {
          state.dm.open = uiInitialState.dmOpen;
          ui.renderDM();
        }
        state.flags = state.flags || {};
        state.flags.menuOpen = !!uiInitialState.menuOpen;
        if (ui._battleInvite && ui._battleInvite._clickOutsideHandler) doc.removeEventListener("click",ui._battleInvite._clickOutsideHandler,true);
        if (ui._battleInvite && ui._battleInvite._clickOutsideTimer) clearTimeout(ui._battleInvite._clickOutsideTimer);
        const orphanInviteDropdown = doc.getElementById("battleInviteDropdown");
        if (orphanInviteDropdown) orphanInviteDropdown.remove();
        ui._battleInvite = uiInitialState.battleInvite;
        if (ui.renderBattles) ui.renderBattles();
        mobileInterface.selectTab(uiInitialState.activeTab || "dm",false);
        if (uiInitialState.menuOpen) ui.showMenu(); else ui.hideMenu();
        ui.ensureMobilePinnedChatLayout();
      } else {
        checks.push(assert(tabs && win.getComputedStyle(tabs).display === "none","desktop_tab_strip_hidden"));
        checks.push(assert(shell && win.getComputedStyle(shell).display === "contents","desktop_panels_keep_flow"));
        checks.push(assert(chat && top && bounds.chat.height > 0 && bounds.top.height > 0,"desktop_chat_and_topbar_visible"));
        checks.push(assert(!handle || win.getComputedStyle(handle).display === "none","desktop_splitter_hidden"));
      }
      const failures = checks.filter((item) => !item.pass);
      results.push({size:width + "x" + height,kind:kind,passed:checks.length-failures.length,total:checks.length,failures:failures,checks:checks,bounds:bounds,dims:dims});
      completedCheckCount += checks.length;
      completedPassCount += checks.length-failures.length;
      report.textContent = results.map((result) => (result.passed===result.total?"PASS":"FAIL") + " " + result.size + " " + result.kind + ": " + result.passed + "/" + result.total + (result.failures.length ? "\n  " + result.failures.map((item) => item.code + " " + item.details).join("\n  ") : "")).join("\n");
      report.className = failures.length ? "fail" : "pass";
      identity.textContent = "Headless Chromium fixture " + width + "×" + height + "; exact iframe viewport " + dims.width + "×" + dims.height + "; app " + frame.contentDocument.title;
      frame.contentWindow.scrollTo(0,0);
      await wait(80);
    };
    (async () => {
      for (const [index,size] of selectedRuns) await loadSize(size,index);
      const total = results.reduce((sum,item) => sum + item.total,0);
      const passed = results.reduce((sum,item) => sum + item.passed,0);
      const expectedRunCount=requestedView===null?sizes.length:1;
      const complete=selectedRuns.length===expectedRunCount&&results.length===selectedRuns.length&&selectedRuns.length>0;
      const finalPass=complete&&passed===total;
      report.className = finalPass?"pass":"fail";
      report.textContent += "\n\nTOTAL " + passed + "/" + total + " " + (finalPass?"PASS":"FAIL");
      if (!complete) report.textContent += "\nRUNS INCOMPLETE " + results.length + "/" + selectedRuns.length;
      identity.textContent = "Finished " + results.length + " exact-size Headless Chromium iframe runs. " + results.map((item) => item.size + " " + item.passed + "/" + item.total).join("; ");
      frame.title = "Asynchronia viewport fixture: " + report.textContent.replace(/\n/g," | ");
    })().catch((error) => {
      report.className = "fail";
      report.textContent += "\n\nRUNNER ERROR " + (error && error.stack || error);
      report.textContent += "\nTOTAL " + completedPassCount + "/" + completedCheckCount + " FAIL\nRUNS INCOMPLETE " + results.length + "/" + selectedRuns.length;
    });
  })();
  </script>
