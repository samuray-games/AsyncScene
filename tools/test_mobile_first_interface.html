<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile-first interface runtime regression</title>
  <style>
    body{font:14px system-ui,sans-serif;margin:16px;color:#162033;background:#edf1f6}
    #result{white-space:pre-wrap;padding:12px;border-radius:8px;background:#fff;min-height:70px}
    iframe{display:block;width:390px;height:844px;max-width:100%;border:1px solid #67758a;border-radius:18px;background:#101722}
    #fixture{position:fixed;left:-10000px;top:0;width:1px;height:1px;overflow:hidden}
    .pass{color:#116b38}.fail{color:#a31324}
  </style>
</head>
<body>
  <h1>Mobile-first interface runtime regression</h1>
  <pre id="result">RUNNING - opening same-origin app at 390 x 844</pre>
  <iframe id="appFrame" title="Mobile app runtime under test" src="/AsyncScene/index.html?mobileInterfaceTest=1"></iframe>
  <div id="fixture"></div>
  <script>
  (async function run(){
    const result=document.getElementById("result");
    const frame=document.getElementById("appFrame");
    const output=[];
    const assert=(condition,message)=>{if(!condition)throw new Error(message);};
    const wait=(ms=40)=>new Promise(resolve=>setTimeout(resolve,ms));
    const raf=(win)=>new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
    const pass=(message)=>output.push(`PASS ${message}`);
    const fail=(message)=>{throw new Error(message);};
    const mobileState=(win)=>win.Game.__DEV.mobileInterface.getActiveTab();
    const visiblePanels=(doc)=>["dmBlock","battlesBlock","eventsBlock"].filter(id=>getComputedStyle(doc.getElementById(id)).display!=="none");
    const activeTab=(doc)=>doc.querySelector('#mobilePanelTabs [role="tab"][aria-selected="true"]');
    const assertOneActive=(doc,key)=>{
      const selected=activeTab(doc);
      assert(selected && selected.getAttribute("data-mobile-tab")===key,`selected tab should be ${key}`);
      assert(mobileState(frame.contentWindow)===key,`controller active tab should be ${key}`);
      assert(visiblePanels(doc).length===1,`exactly one tabpanel should display; found ${visiblePanels(doc).join(",")}`);
      assert(visiblePanels(doc)[0]===({dm:"dmBlock",battles:"battlesBlock",events:"eventsBlock"})[key],`visible tabpanel should match ${key}`);
      const panel=doc.getElementById(({dm:"dmBlock",battles:"battlesBlock",events:"eventsBlock"})[key]);
      assert(panel.getAttribute("role")==="tabpanel" && panel.getAttribute("aria-hidden")==="false",`${key} tabpanel ARIA state`);
    };
    const pointer=(win,type,target,x,y,id=701)=>target.dispatchEvent(new win.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",isPrimary:true,button:0,clientX:x,clientY:y}));
    const swipe=(win,doc,target,dx,dy=0)=>{
      const rect=target.getBoundingClientRect(),x=rect.left+Math.min(20,rect.width/3),y=rect.top+Math.min(20,rect.height/3),id=Math.floor(Math.random()*100000)+1000;
      pointer(win,"pointerdown",target,x,y,id);
      pointer(win,"pointermove",doc,x+dx,y+dy,id);
      pointer(win,"pointerup",doc,x+dx,y+dy,id);
      target.dispatchEvent(new win.MouseEvent("click",{bubbles:true,cancelable:true}));
    };
    const snapshotGameUiState=(S)=>JSON.stringify({
      dm:S.dm,
      flags:S.flags,
      battles:(S.battles||[]).map(b=>({id:b.id,resolved:b.resolved,status:b.status,escapeVote:b.escapeVote})),
      events:S.events,
    });
    const setFrameSize=async(width,height)=>{frame.style.width=`${width}px`;frame.style.height=`${height}px`;await wait(70);await raf(frame.contentWindow);};
    try{
      const deadline=Date.now()+25000;
      while(Date.now()<deadline){
        try{if(frame.contentDocument&&frame.contentDocument.getElementById("mobileTabDm")&&frame.contentWindow.Game?.__DEV?.mobileInterface)break;}catch(_){}
        await wait(100);
      }
      const win=frame.contentWindow,doc=frame.contentDocument,Game=win.Game,UI=Game.UI;
      assert(Game&&UI&&Game.__DEV.mobileInterface,"mobile UI controller failed to initialize");
      assert(win.matchMedia("(max-width: 860px)").matches,"390px iframe must use the existing 860px breakpoint");
      const start=doc.getElementById("startScreen");if(start)start.style.display="none";
      await raf(win);
      const meId=String(Game.__S.me?.id||"");
      const dmPlayer=Object.values(Game.__S.players||{}).find(player=>player&&String(player.id)!==meId);
      assert(Game.__S.dm.open===false,"fresh DM state must start closed");
      UI.closeDM();await wait(80);
      assert(Game.__S.dm.open===false&&doc.getElementById("dmBlock").classList.contains("hidden"),"UI.closeDM must own the closed DM hidden state");
      doc.getElementById("mobileTabBattles").click();await raf(win);
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(getComputedStyle(doc.getElementById("dmBlock")).display==="none","selecting the closed DM tab must not reveal its panel or composer");
      assert(dmPlayer,"fresh UI state must contain an available DM recipient; players="+Object.keys(Game.__S.players||{}).join(","));
      assert(UI.openDM(dmPlayer.id)!==false,"a legitimate UI.openDM action should open an available player DM");
      await wait(80);
      assert(Game.__S.dm.open===true&&!doc.getElementById("dmBlock").classList.contains("hidden"),"UI.openDM must reopen the DM panel");
      doc.getElementById("mobileTabBattles").click();await raf(win);
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(getComputedStyle(doc.getElementById("dmBlock")).display!=="none","an explicitly opened DM remains available when its tab is selected");
      UI.closeDM();await wait(80);
      doc.getElementById("mobileTabBattles").click();await raf(win);
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(getComputedStyle(doc.getElementById("dmBlock")).display==="none","tab selection preserves UI.closeDM after a real open/close cycle");
      UI.openDM(dmPlayer.id);await wait(80);
      doc.getElementById("mobileTabDm").click();await raf(win);
      pass("fresh/closed/open/closed DM lifecycle preserves renderer-owned panel visibility");
      assertOneActive(doc,"dm");
      for(const id of ["topBar","left","mobilePanelTabs"]){const r=doc.getElementById(id).getBoundingClientRect();assert(r.width>0&&r.height>0,`${id} must be visible`);assert(r.left>=-1&&r.right<=win.innerWidth+1,`${id} must fit the viewport width`);}
      assert(doc.documentElement.scrollWidth<=win.innerWidth+1&&doc.body.scrollWidth<=win.innerWidth+1,"no horizontal page overflow at 390px");
      pass("390x844: stats/menu, chat, tab strip, one tabpanel and no horizontal overflow");

      // Exercise panel/body visibility when gameplay or progressive disclosure gates content.
      const battlesBlock=doc.getElementById("battlesBlock"),battlesBody=doc.getElementById("battlesBody");
      const battleWasHidden=battlesBlock.classList.contains("hidden"),battleBodyWasHidden=battlesBody.classList.contains("hidden");
      battlesBlock.classList.add("hidden");battlesBody.classList.add("hidden");
      doc.getElementById("mobileTabBattles").click();await raf(win);
      assert(getComputedStyle(battlesBlock).display==="none"&&getComputedStyle(battlesBody).display==="none","selected battle tab must preserve gated/closed hidden state on its panel and body");
      battlesBlock.classList.toggle("hidden",battleWasHidden);battlesBody.classList.toggle("hidden",battleBodyWasHidden);
      const collapsedEventsBody=doc.getElementById("eventsBody"),eventsWasHidden=collapsedEventsBody.classList.contains("hidden");
      collapsedEventsBody.classList.add("hidden");
      doc.getElementById("mobileTabEvents").click();await raf(win);
      assert(getComputedStyle(collapsedEventsBody).display==="none","selected Events tab must preserve the renderer's collapsed hidden body");
      collapsedEventsBody.classList.toggle("hidden",eventsWasHidden);
      doc.getElementById("mobileTabDm").click();await raf(win);
      pass("fresh/closed/open/closed DM plus gated battle and collapsed Events hidden-state regressions");

      const renderCounts={};
      for(const name of ["renderAll","renderDM","renderBattles","renderEvents"]){const original=UI[name];renderCounts[name]=0;if(typeof original==="function")UI[name]=function(...args){renderCounts[name]++;return original.apply(this,args);};}
      const beforeState=snapshotGameUiState(Game.__S);
      const dmDraft=doc.getElementById("dmInput");dmDraft.value="draft survives tab changes";
      doc.getElementById("mobileTabBattles").click();await raf(win);assertOneActive(doc,"battles");
      doc.getElementById("mobileTabEvents").click();await raf(win);assertOneActive(doc,"events");
      doc.getElementById("mobileTabDm").click();await raf(win);assertOneActive(doc,"dm");
      assert(dmDraft.value==="draft survives tab changes","DM draft must survive tab changes");
      assert(snapshotGameUiState(Game.__S)===beforeState,"tab switching must not mutate game state");
      assert(Object.values(renderCounts).every(value=>value===0),`tab switching must not invoke renderers: ${JSON.stringify(renderCounts)}`);
      pass("one-tap tabs preserve DM draft/game state and invoke no renderers");

      const eventsBody=doc.getElementById("eventsBody");
      const eventSource=doc.getElementById("eventsHeaderCount");
      const oldEventCount=eventSource.textContent;
      const currentBeforeCount=mobileState(win);
      eventSource.textContent=" (7)";await wait(50);
      assert(doc.querySelector('[data-mobile-count="events"]').textContent==="7","Events tab must mirror the existing Events counter");
      assert(mobileState(win)===currentBeforeCount,"new events must not switch tabs");
      eventSource.textContent=oldEventCount;await wait(50);
      const oldContent=eventsBody.innerHTML;
      const eventsOriginallyHidden=eventsBody.classList.contains("hidden");
      eventsBody.classList.remove("hidden");
      eventsBody.innerHTML="";
      for(let i=0;i<30;i++){const row=doc.createElement("div");row.textContent=`test scroll row ${i}`;row.style.height="42px";row.style.flex="0 0 42px";eventsBody.appendChild(row);}
      doc.getElementById("mobileTabEvents").click();await raf(win);
      eventsBody.scrollTop=180;
      assert(eventsBody.scrollTop>0,"active Events content must scroll vertically");
      const preservedScroll=eventsBody.scrollTop;
      const eventProbe=eventsBody.firstElementChild;
      doc.getElementById("mobileTabDm").click();await raf(win);
      doc.getElementById("mobileTabEvents").click();await raf(win);
      assert(eventsBody.scrollTop===preservedScroll,"Events scroll position must survive tab changes");
      assert(eventsBody.firstElementChild===eventProbe,"panel DOM/open card nodes must remain mounted between tabs");
      eventsBody.innerHTML=oldContent;
      eventsBody.classList.toggle("hidden",eventsOriginallyHidden);
      pass("counter mirrors existing source; event updates do not auto-switch; panel scroll and open DOM persist");

      doc.getElementById("mobileTabDm").click();await raf(win);
      const dmBody=doc.querySelector("#dmBlock .panelBody");
      const action=doc.createElement("button");action.type="button";action.title="Mobile help test description";action.textContent="test action";
      let actionCount=0;action.addEventListener("click",()=>actionCount++);dmBody.appendChild(action);
      action.click();assert(actionCount===1,"short tap/click must execute the action immediately once");
      actionCount=0;
      swipe(win,doc,action,-90);
      assert(mobileState(win)==="dm","swipe beginning on a button must not switch tabs");
      assert(actionCount===0,"swipe must not activate the game button");
      swipe(win,doc,dmBody.firstElementChild||dmBody,90);
      assert(mobileState(win)==="dm","right swipe at first tab must stop at the edge");
      const battlePanel=doc.getElementById("battlesBlock"),battleBody=doc.getElementById("battlesBody");
      const battlePanelInitiallyHidden=battlePanel.classList.contains("hidden"),battleBodyInitiallyHidden=battleBody.classList.contains("hidden");
      const battleContent=battleBody.innerHTML;
      battlePanel.classList.remove("hidden");battleBody.classList.remove("hidden");
      battleBody.innerHTML="";
      for(let i=0;i<30;i++){const row=doc.createElement("div");row.textContent="test battle scroll row "+i;row.style.height="42px";row.style.flex="0 0 42px";battleBody.appendChild(row);}
      swipe(win,doc,dmBody.firstElementChild||dmBody,-90);
      assert(mobileState(win)==="battles","left swipe in active panel must select next tab");
      swipe(win,doc,battleBody,-90);
      assert(mobileState(win)==="events","second left swipe must select Events");
      swipe(win,doc,doc.getElementById("eventsBlock").querySelector(".panelBody"),-90);
      assert(mobileState(win)==="events","left swipe at last tab must stop at the edge");
      swipe(win,doc,doc.getElementById("eventsBlock").querySelector(".panelBody"),90);
      assert(mobileState(win)==="battles","right swipe must select previous tab");
      swipe(win,doc,battleBody,4,80);
      assert(mobileState(win)==="battles","vertical movement must not switch tabs");
      battleBody.scrollTop=60;assert(battleBody.scrollTop===60,"vertical panel content remains programmatically scrollable");
      assert(Object.values(renderCounts).every(value=>value===0),"tab swipes must not rerender game panels");
      battleBody.innerHTML=battleContent;
      battlePanel.classList.toggle("hidden",battlePanelInitiallyHidden);battleBody.classList.toggle("hidden",battleBodyInitiallyHidden);
      pass("horizontal swipes both ways, edge stops, vertical scroll, and buttons are not intercepted");

      doc.getElementById("mobileTabDm").click();await raf(win);
      const beforeResize=doc.getElementById("left").getBoundingClientRect().height;
      const handle=doc.getElementById("chatResizeHandle"),hr=handle.getBoundingClientRect(),pid=8801;
      pointer(win,"pointerdown",handle,hr.left+hr.width/2,hr.top+hr.height/2,pid);
      pointer(win,"pointermove",doc,hr.left+hr.width/2,hr.top+hr.height/2-50,pid);
      pointer(win,"pointerup",doc,hr.left+hr.width/2,hr.top+hr.height/2-50,pid);
      await raf(win);
      const afterUp=doc.getElementById("left").getBoundingClientRect().height;
      assert(afterUp<beforeResize,"dragging the divider up must reduce chat height");
      const panelsAfterUp=doc.getElementById("mobilePanelShell").getBoundingClientRect().height;
      pointer(win,"pointerdown",handle,hr.left+hr.width/2,hr.top+hr.height/2,pid+1);
      pointer(win,"pointermove",doc,hr.left+hr.width/2,hr.top+hr.height/2+45,pid+1);
      pointer(win,"pointerup",doc,hr.left+hr.width/2,hr.top+hr.height/2+45,pid+1);
      await raf(win);
      assert(doc.getElementById("left").getBoundingClientRect().height>afterUp,"dragging down must grow chat again");
      assert(panelsAfterUp>0,"lower panel remains available after resize");
      for(const key of ["ArrowUp","ArrowDown","Home","End"]){handle.dispatchEvent(new win.KeyboardEvent("keydown",{key,bubbles:true,cancelable:true}));await raf(win);}
      assert(Number(handle.getAttribute("aria-valuenow"))>=Number(handle.getAttribute("aria-valuemin")),"separator cannot shrink below its minimum");
      assert(Number(handle.getAttribute("aria-valuenow"))<=Number(handle.getAttribute("aria-valuemax")),"separator cannot grow beyond its maximum");
      pass("existing separator drag direction, minimum/maximum, and keyboard control");

      action.dispatchEvent(new win.PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:9301,pointerType:"touch",isPrimary:true,button:0,clientX:20,clientY:20}));
      await wait(550);
      const hint=doc.getElementById("mobileLongPressHint");
      assert(hint&&hint.classList.contains("is-visible")&&hint.textContent==="Mobile help test description","long press must show its help description");
      assert(action.getAttribute("aria-describedby")==="mobileLongPressHint","hint must be associated to the focused/action surface");
      action.dispatchEvent(new win.PointerEvent("pointerup",{bubbles:true,cancelable:true,pointerId:9301,pointerType:"touch",isPrimary:true,button:0,clientX:20,clientY:20}));
      action.dispatchEvent(new win.MouseEvent("click",{bubbles:true,cancelable:true}));
      assert(actionCount===0,"long press must suppress the action click");
      doc.dispatchEvent(new win.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
      action.dispatchEvent(new win.PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:9302,pointerType:"touch",isPrimary:true,button:0,clientX:20,clientY:20}));
      action.dispatchEvent(new win.PointerEvent("pointermove",{bubbles:true,cancelable:true,pointerId:9302,pointerType:"touch",isPrimary:true,button:0,clientX:22,clientY:40}));
      action.dispatchEvent(new win.PointerEvent("pointerup",{bubbles:true,cancelable:true,pointerId:9302,pointerType:"touch",isPrimary:true,button:0,clientX:22,clientY:40}));
      await wait(550);
      assert(!hint.classList.contains("is-visible"),"scroll movement must cancel long-press recognition");
      action.remove();
      pass("short action fires once; long press opens an accessible hint without acting; scroll cancels it");

      const capCases=[
        {selector:".pointsWrap .statIcon",owner:".pointsWrap",message:"Points limit reached: no more points this week."},
        {selector:'[data-profile-stat="rep"] .statIcon',owner:'[data-profile-stat="rep"]',message:"REP limit reached: no more REP this week."},
      ];
      for(let i=0;i<capCases.length;i++){
        const {selector,owner,message}=capCases[i],icon=doc.querySelector(selector),chip=icon&&icon.closest(owner);
        assert(icon&&chip,"real points/REP stat icon and cap-bearing profile chip must exist");
        const oldCap=chip.getAttribute("data-stat-cap-hint");
        chip.setAttribute("data-stat-cap-hint",message);
        pointer(win,"pointerdown",icon,12,12,9350+i);
        await wait(550);
        assert(hint.classList.contains("is-visible")&&hint.textContent===message,selector+" long press prioritizes the active ancestor cap message");
        assert(icon.getAttribute("aria-describedby")==="mobileLongPressHint","touched stat icon remains the hint's ARIA owner");
        pointer(win,"pointerup",icon,12,12,9350+i);
        doc.dispatchEvent(new win.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
        if(oldCap==null)chip.removeAttribute("data-stat-cap-hint");else chip.setAttribute("data-stat-cap-hint",oldCap);
      }
      pass("touch-pointer long press shows active points and REP cap details while the touched icon owns ARIA");

      UI.showStatToast("points","Mobile reward notice");UI.showStatToast("rep","Mobile status changed");
      await wait(120);
      const persistentToast=doc.getElementById("stage6UnifiedStatToast");
      assert(persistentToast&&getComputedStyle(persistentToast).display!=="none"&&persistentToast.textContent.includes("Mobile reward notice")&&persistentToast.textContent.includes("Mobile status changed"),"existing persistent stat notifications must display");
      persistentToast.dispatchEvent(new win.PointerEvent("pointerleave",{bubbles:true,pointerType:"touch"}));
      persistentToast.dispatchEvent(new win.PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:9401,pointerType:"touch",isPrimary:true,button:0,clientX:10,clientY:10}));
      await wait(550);
      assert(getComputedStyle(persistentToast).display!=="none","leave and long press must not dismiss persistent stat notifications");
      persistentToast.click();
      assert(getComputedStyle(persistentToast).display==="none","tapping the persistent toast dismisses it");
      pass("persistent stat notifications stay separate from swipe/long-press hints and remain tap-dismissible");

      const preferred=doc.getElementById("left").getBoundingClientRect().height;
      await setFrameSize(320,568);
      assert(win.matchMedia("(max-width: 860px)").matches&&win.innerWidth<=321,"narrow viewport is responsive");
      assert(doc.documentElement.scrollWidth<=win.innerWidth+1,"narrow viewport has no horizontal page overflow");
      await setFrameSize(844,390);
      assert(win.innerWidth>=843&&win.innerHeight<=391,"landscape viewport is applied");
      const chatRect=doc.getElementById("left").getBoundingClientRect(),shellRect=doc.getElementById("mobilePanelShell").getBoundingClientRect();
      assert(chatRect.height>0&&shellRect.height>0&&shellRect.bottom<=win.innerHeight+2,"landscape layout keeps chat and panels inside the viewport");
      await setFrameSize(390,420);
      const chatInput=doc.getElementById("chatInput"),send=doc.getElementById("btnSend");
      const inputRect=chatInput.getBoundingClientRect(),sendRect=send.getBoundingClientRect();
      assert(inputRect.top>=0&&inputRect.bottom<=win.innerHeight+2&&sendRect.top>=0&&sendRect.bottom<=win.innerHeight+2,"chat input and send button remain in the shrunken viewport");
      await setFrameSize(390,844);
      assert(Math.abs(doc.getElementById("left").getBoundingClientRect().height-preferred)<2,"closing keyboard-like viewport shrink restores the chosen chat size");
      await setFrameSize(1024,768);
      assert(getComputedStyle(doc.getElementById("mobilePanelTabs")).display==="none","desktop hides mobile tabs");
      assert(!doc.getElementById("blocks").hasAttribute("data-active-tab"),"desktop has no active mobile tab state");
      assert(!doc.getElementById("dmBlock").hasAttribute("role"),"desktop panel semantics remain unchanged");
      pass("narrow, landscape, keyboard-height resize recovery, and desktop breakpoint");
      await setFrameSize(390,844);
      assertOneActive(doc,"dm");
      pass("restores mobile viewport after desktop breakpoint check");

      result.className="pass";result.textContent=`PASS\n${output.join("\n")}\n\nLIMIT: this browser test simulates touch pointer events and reduced viewport height; it does not emulate physical iOS touch hardware or the native iPhone keyboard.`;
      document.documentElement.dataset.testResult="pass";
    }catch(error){
      result.className="fail";result.textContent=`FAIL\n${error&&error.stack||error}\n\nPassed before failure:\n${output.join("\n")}`;
      document.documentElement.dataset.testResult="fail";
    }
  })();
  </script>
</body>
</html>
