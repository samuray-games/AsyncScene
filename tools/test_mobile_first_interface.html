<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mobile-first interface runtime regression</title>
  <style>
    body{font:14px system-ui,sans-serif;margin:16px;color:#162033;background:#edf1f6}
    #result{white-space:pre-wrap;padding:12px;border-radius:8px;background:#fff;min-height:70px}
    iframe{display:block;width:390px;height:844px;max-width:100%;border:1px solid #67758a;border-radius:18px;background:#101722}
    #fixture{position:fixed;left:-10000px;top:0;width:1px;height:1px;overflow:hidden}
    .pass{color:#116b38}.fail{color:#a31324}
  </style>
</head>
<body>
  <h1>Mobile-first interface runtime regression</h1>
  <pre id="result">RUNNING - opening same-origin app at 390 x 844</pre>
  <iframe id="appFrame" title="Mobile app runtime under test" src="/AsyncScene/index.html?mobileInterfaceTest=1"></iframe>
  <div id="fixture"></div>
  <script>
  (async function run(){
    const result=document.getElementById("result");
    const frame=document.getElementById("appFrame");
    const output=[];
    const assert=(condition,message)=>{if(!condition)throw new Error(message);};
    const wait=(ms=40)=>new Promise(resolve=>setTimeout(resolve,ms));
    const raf=(win)=>new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));
    const pass=(message)=>output.push(`PASS ${message}`);
    const fail=(message)=>{throw new Error(message);};
    const mobileState=(win)=>win.Game.__DEV.mobileInterface.getActiveTab();
    const visiblePanels=(doc)=>["dmBlock","battlesBlock","eventsBlock"].filter(id=>getComputedStyle(doc.getElementById(id)).display!=="none");
    const activeTab=(doc)=>doc.querySelector('#mobilePanelTabs [role="tab"][aria-selected="true"]');
    const assertOneActive=(doc,key)=>{
      const selected=activeTab(doc);
      assert(selected && selected.getAttribute("data-mobile-tab")===key,`selected tab should be ${key}`);
      assert(mobileState(frame.contentWindow)===key,`controller active tab should be ${key}`);
      assert(visiblePanels(doc).length===1,`exactly one tabpanel should display; found ${visiblePanels(doc).join(",")}`);
      assert(visiblePanels(doc)[0]===({dm:"dmBlock",battles:"battlesBlock",events:"eventsBlock"})[key],`visible tabpanel should match ${key}`);
      const panel=doc.getElementById(({dm:"dmBlock",battles:"battlesBlock",events:"eventsBlock"})[key]);
      assert(panel.getAttribute("role")==="tabpanel" && panel.getAttribute("aria-hidden")==="false",`${key} tabpanel ARIA state`);
    };
    const pointer=(win,type,target,x,y,id=701)=>target.dispatchEvent(new win.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",isPrimary:true,button:0,clientX:x,clientY:y}));
    const touch=(win,type,target,x,y,id=701)=>{
      const event=new win.Event(type,{bubbles:true,cancelable:true});
      const point={identifier:id,clientX:x,clientY:y,target};
      Object.defineProperty(event,"changedTouches",{value:[point]});
      Object.defineProperty(event,"touches",{value:type==="touchend"||type==="touchcancel"?[]:[point]});
      return target.dispatchEvent(event);
    };
    const swipe=(win,doc,target,dx,dy=0)=>{
      const rect=target.getBoundingClientRect(),x=rect.left+Math.min(20,rect.width/3),y=rect.top+Math.min(20,rect.height/3),id=Math.floor(Math.random()*100000)+1000;
      pointer(win,"pointerdown",target,x,y,id);
      pointer(win,"pointermove",doc,x+dx,y+dy,id);
      pointer(win,"pointerup",doc,x+dx,y+dy,id);
      target.dispatchEvent(new win.MouseEvent("click",{bubbles:true,cancelable:true}));
    };
    const touchSwipe=(win,doc,target,dx,dy=0)=>{
      const rect=target.getBoundingClientRect(),x=rect.left+Math.max(30,Math.min(50,rect.width/3)),y=rect.top+Math.max(8,Math.min(20,rect.height/3)),id=Math.floor(Math.random()*100000)+200000;
      touch(win,"touchstart",target,x,y,id);
      touch(win,"touchmove",doc,x+dx,y+dy,id);
      touch(win,"touchend",doc,x+dx,y+dy,id);
      target.dispatchEvent(new win.MouseEvent("click",{bubbles:true,cancelable:true}));
    };
    const mixedTouchSwipe=(win,doc,target,cancelType,dx,dy=0)=>{
      const rect=target.getBoundingClientRect(),x=rect.left+Math.max(30,Math.min(50,rect.width/3)),y=rect.top+Math.max(8,Math.min(20,rect.height/3)),id=Math.floor(Math.random()*100000)+300000;
      pointer(win,"pointerdown",target,x,y,id);
      touch(win,"touchstart",target,x,y,id);
      if(cancelType)pointer(win,cancelType,doc,x,y,id);
      touch(win,"touchmove",doc,x+dx,y+dy,id);
      touch(win,"touchend",doc,x+dx,y+dy,id);
      target.dispatchEvent(new win.MouseEvent("click",{bubbles:true,cancelable:true}));
    };
    const snapshotGameUiState=(S)=>JSON.stringify({
      dm:S.dm,
      flags:S.flags,
      battles:(S.battles||[]).map(b=>({id:b.id,resolved:b.resolved,status:b.status,escapeVote:b.escapeVote})),
      events:S.events,
    });
    const setFrameSize=async(width,height)=>{frame.style.width=`${width}px`;frame.style.height=`${height}px`;await wait(70);await raf(frame.contentWindow);};
    try{
      const deadline=Date.now()+25000;
      while(Date.now()<deadline){
        try{if(frame.contentDocument&&frame.contentDocument.getElementById("mobileTabDm")&&frame.contentWindow.Game?.__DEV?.mobileInterface)break;}catch(_){}
        await wait(100);
      }
      const win=frame.contentWindow,doc=frame.contentDocument,Game=win.Game,UI=Game.UI;
      assert(Game&&UI&&Game.__DEV.mobileInterface,"mobile UI controller failed to initialize");
      assert(win.matchMedia("(max-width: 860px)").matches,"390px iframe must use the existing 860px breakpoint");
      const battleTitle=doc.querySelector("#battlesHeader .battleTitleText"),battleTabTitle=doc.querySelector("#mobileTabBattles > span");
      const renderedTitles=["Споры","Дебаты","Стычки","Баттлы","Разборки"];
      for(const title of renderedTitles){
        battleTitle.textContent=title;Game.__DEV.mobileInterface.updateCounters();
        assert(battleTabTitle.textContent===title,`mobile battle tab follows renderer title ${title}`);
        const count=doc.querySelector('[data-mobile-count="battles"]').textContent;
        assert(doc.getElementById("mobileTabBattles").getAttribute("aria-label")===`${title} (${count})`,`battle tab accessible name follows renderer title and count for ${title}`);
      }
      battleTitle.textContent="Споры";Game.__DEV.mobileInterface.updateCounters();
      pass("mobile battle label and accessible name follow five renderer-provided tone titles");
      for(const id of ["dmBlockHeader","battlesHeader","eventsHeader"]){
        const header=doc.getElementById(id);
        assert(header&&getComputedStyle(header).display==="none"&&header.getBoundingClientRect().height===0,`${id} duplicate outer header has zero mobile height while its DOM remains mounted`);
      }
      assert(doc.getElementById("battleCount")&&doc.getElementById("eventsHeaderCount"),"renderer-owned counters remain mounted while duplicate headers are hidden");
      pass("mobile duplicate outer headers have zero height while header nodes and counters remain mounted");
      const start=doc.getElementById("startScreen");
      if(start&&!start.classList.contains("hidden")&&getComputedStyle(start).display!=="none"){
        const name=doc.getElementById("nameInput");if(name)name.value="Mobile Regression";
        doc.getElementById("btnStart").click();
        const startDeadline=Date.now()+15000;
        while(Date.now()<startDeadline&&!start.classList.contains("hidden")&&getComputedStyle(start).display!=="none")await wait(80);
        assert(start.classList.contains("hidden")||getComputedStyle(start).display==="none","isolated fresh test origin must enter a new game before panel-state checks");
      }
      await raf(win);
      const meId=String(Game.__S.me?.id||"");
      const dmPlayer=Object.values(Game.__S.players||{}).find(player=>player&&String(player.id)!==meId);
      // Normalize whatever tutorial/save state the test origin loaded, then
      // assert the real close path owns the expected closed panel state.
      UI.closeDM();await wait(80);
      assert(Game.__S.dm.open===false&&doc.getElementById("dmBlock").classList.contains("hidden"),"UI.closeDM must own the closed DM hidden state");
      const freshClosedState=snapshotGameUiState(Game.__S);
      const swipeFreshPanel=(dx,dy=0)=>{
        const key=mobileState(win),id=({dm:"dmBlock",battles:"battlesBlock",events:"eventsBlock"})[key];
        const panel=doc.getElementById(id),body=panel&&(panel.querySelector(".panelBody")||panel.querySelector("#battlesBody,#eventsBody"));
        const target=panel&&!panel.classList.contains("hidden")&&body&&getComputedStyle(body).display!=="none"?body:doc.getElementById("blocks");
        touchSwipe(win,doc,target,dx,dy);
      };
      swipeFreshPanel(-90);
      assert(mobileState(win)==="battles","fresh closed-DM lower panel must swipe left to Battles");
      assert(Game.__S.dm.open===false&&doc.getElementById("dmBlock").classList.contains("hidden"),"empty-panel swipe must not open the DM");
      swipeFreshPanel(-90);
      assert(mobileState(win)==="events","the next empty-panel left swipe must select Events");
      swipeFreshPanel(90);
      assert(mobileState(win)==="battles","empty-panel right swipe must select the previous tab");
      swipeFreshPanel(90);
      assert(mobileState(win)==="dm","the reverse empty-panel swipe must return to closed DM");
      swipeFreshPanel(0,80);
      assert(mobileState(win)==="dm","vertical movement in the empty panel must not switch tabs");
      assert(snapshotGameUiState(Game.__S)===freshClosedState,"fresh empty-panel swipes must not open DM or alter game state");
      doc.getElementById("mobileTabDm").click();await raf(win);
      doc.getElementById("mobileTabBattles").click();await raf(win);
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(getComputedStyle(doc.getElementById("dmBlock")).display==="none","selecting the closed DM tab must not reveal its panel or composer");
      assert(dmPlayer,"fresh UI state must contain an available DM recipient; players="+Object.keys(Game.__S.players||{}).join(","));
      assert(UI.openDM(dmPlayer.id)!==false,"a legitimate UI.openDM action should open an available player DM");
      await wait(80);
      assert(Game.__S.dm.open===true&&!doc.getElementById("dmBlock").classList.contains("hidden"),"UI.openDM must reopen the DM panel");
      doc.getElementById("mobileTabBattles").click();await raf(win);
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(getComputedStyle(doc.getElementById("dmBlock")).display!=="none","an explicitly opened DM remains available when its tab is selected");
      UI.closeDM();await wait(80);
      doc.getElementById("mobileTabBattles").click();await raf(win);
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(getComputedStyle(doc.getElementById("dmBlock")).display==="none","tab selection preserves UI.closeDM after a real open/close cycle");
      UI.openDM(dmPlayer.id);await wait(80);
      doc.getElementById("mobileTabDm").click();await raf(win);
      pass("fresh/closed/open/closed DM lifecycle preserves renderer-owned panel visibility");
      assertOneActive(doc,"dm");

      // Execute mixed native-touch and Pointer Events sequences. These are DOM
      // lifecycle regressions, not a simulation of physical iOS Safari hardware.
      const touchSwitches=[];
      const switchObserver=new win.MutationObserver(records=>records.forEach(record=>{
        if(record.attributeName==="aria-selected"&&record.target.getAttribute("aria-selected")==="true")touchSwitches.push(record.target.getAttribute("data-mobile-tab"));
      }));
      switchObserver.observe(doc.getElementById("mobilePanelTabs"),{subtree:true,attributes:true,attributeFilter:["aria-selected"]});
      const touchActionTarget=doc.querySelector("#dmBlock .panelBody");
      let beforeSwitches=touchSwitches.length;
      mixedTouchSwipe(win,doc,touchActionTarget,"pointercancel",-90);
      await wait(0);
      assert(mobileState(win)==="battles","pointercancel between touchstart and touchmove must preserve the native touch swipe");
      assert(touchSwitches.length-beforeSwitches===1&&touchSwitches.at(-1)==="battles","pointercancel mixed stream must switch exactly once");
      pass("A: pointerdown/touchstart/pointercancel/touchmove/touchend switches once");

      beforeSwitches=touchSwitches.length;
      mixedTouchSwipe(win,doc,doc.getElementById("battlesBody"),"lostpointercapture",-90);
      await wait(0);
      assert(mobileState(win)==="events","lostpointercapture must leave the active native touch swipe intact");
      assert(touchSwitches.length-beforeSwitches===1&&touchSwitches.at(-1)==="events","lostpointercapture mixed stream must switch exactly once");
      pass("B: pointerdown/touchstart/lostpointercapture/touchmove/touchend switches once");

      const eventPanelBody=doc.querySelector("#eventsBlock .panelBody");
      const eventRect=eventPanelBody.getBoundingClientRect(),eventX=eventRect.left+40,eventY=eventRect.top+20,cancelId=401001;
      beforeSwitches=touchSwitches.length;
      touch(win,"touchstart",eventPanelBody,eventX,eventY,cancelId);
      touch(win,"touchcancel",doc,eventX-90,eventY,cancelId);
      touch(win,"touchend",doc,eventX-90,eventY,cancelId);
      await wait(0);
      assert(mobileState(win)==="events"&&touchSwitches.length===beforeSwitches,"touchcancel must discard the touch gesture and prevent a later touchend switch");
      pass("C: touchcancel cancels the active touch gesture");

      await wait(820);
      pointer(win,"pointerdown",eventPanelBody,eventX,eventY,401002);
      pointer(win,"pointermove",doc,eventX+90,eventY,401002);
      pointer(win,"pointerup",doc,eventX+90,eventY,401002);
      await wait(0);
      assert(mobileState(win)==="battles","a pointer-only horizontal gesture still selects the previous tab");
      assert(touchSwitches.length-beforeSwitches===1&&touchSwitches.at(-1)==="battles","pointer-only stream must switch exactly once");
      pass("D: ordinary pointer-only navigation remains active");

      const battlePanelBody=doc.getElementById("battlesBody"),battleRect=battlePanelBody.getBoundingClientRect(),battleX=battleRect.left+40,battleY=battleRect.top+20,verticalId=401003;
      beforeSwitches=touchSwitches.length;
      touch(win,"touchstart",battlePanelBody,battleX,battleY,verticalId);
      touch(win,"touchmove",doc,battleX,battleY+90,verticalId);
      touch(win,"touchend",doc,battleX,battleY+90,verticalId);
      await wait(0);
      assert(mobileState(win)==="battles"&&touchSwitches.length===beforeSwitches,"vertical touch movement must not switch tabs");
      pass("E: vertical touch gesture keeps the current tab for native scrolling");
      switchObserver.disconnect();

      // Simulate persisted desktop size preferences through the normal core
      // class application path, without invoking a persistence setter.
      const originalGetPanelSizes=Game.__A.getPanelSizes;
      const persistedSizes={dm:"collapsed",battles:"collapsed",events:"collapsed"};
      const panelSizesWere=Object.fromEntries(Object.keys(persistedSizes).map(key=>[key,doc.getElementById(({dm:"dmBlock",battles:"battlesBlock",events:"eventsBlock"})[key]).className]));
      const bodyStatesWere={
        dm:doc.querySelector("#dmBlock .panelBody").classList.contains("hidden"),
        battles:doc.getElementById("battlesBody").classList.contains("hidden"),
        events:doc.getElementById("eventsBody").classList.contains("hidden"),
      };
      Game.__A.getPanelSizes=()=>persistedSizes;
      const allowedPanels={dm:doc.getElementById("dmBlock"),battles:doc.getElementById("battlesBlock"),events:doc.getElementById("eventsBlock")};
      const allowedBodies={dm:doc.querySelector("#dmBlock .panelBody"),battles:doc.getElementById("battlesBody"),events:doc.getElementById("eventsBody")};
      for(const key of ["dm","battles","events"]){
        allowedPanels[key].classList.remove("hidden");
        allowedBodies[key].classList.remove("hidden");
        UI.applyPanelSizeClasses(allowedPanels[key],key);
        assert(allowedPanels[key].classList.contains("panel--collapsed"),key+" must retain its persisted collapsed preference class");
        assert(getComputedStyle(allowedBodies[key]).display!=="none",key+" allowed content remains visible on mobile with persisted collapsed size");
      }
      assert(doc.querySelector("#dmBlock .panelBody").isConnected,"open DM content remains mounted with persisted collapsed size");
      for(const id of ["mobileTabDm","mobileTabBattles","mobileTabEvents"]){doc.getElementById(id).click();await raf(win);}
      for(const key of ["dm","battles","events"])assert(getComputedStyle(allowedBodies[key]).display!=="none",key+" stays available across tab changes with persisted collapsed size");
      const hiddenDMBody=allowedBodies.dm,hiddenBattleBody=allowedBodies.battles,hiddenEventBody=allowedBodies.events;
      hiddenDMBody.classList.add("hidden");hiddenBattleBody.classList.add("hidden");hiddenEventBody.classList.add("hidden");
      for(const [key,id] of [["dm","mobileTabDm"],["battles","mobileTabBattles"],["events","mobileTabEvents"]]){
        doc.getElementById(id).click();await raf(win);
        assert(getComputedStyle(allowedBodies[key]).display==="none",key+" renderer-owned hidden state must override collapsed-size mobile presentation");
      }
      const beforeDesktop=frame.getBoundingClientRect().width;
      await setFrameSize(1024,768);
      for(const key of ["dm","battles","events"])assert(getComputedStyle(allowedBodies[key]).display==="none",key+" desktop collapsed preference must still hide its body");
      await setFrameSize(390,844);
      Game.__A.getPanelSizes=originalGetPanelSizes;
      for(const key of ["dm","battles","events"]){
        allowedPanels[key].className=panelSizesWere[key];
        allowedBodies[key].classList.toggle("hidden",bodyStatesWere[key]);
      }
      doc.getElementById("mobileTabDm").click();await raf(win);
      assert(beforeDesktop>=390&&beforeDesktop<=392,"mobile fixture began at expected 390px CSS width before desktop behavior check");
      pass("open DM, allowed Battles and Events remain available with persisted collapsed size; renderer hidden states and desktop collapsed behavior remain intact");
      for(const id of ["topBar","left","mobilePanelTabs"]){const r=doc.getElementById(id).getBoundingClientRect();assert(r.width>0&&r.height>0,`${id} must be visible`);assert(r.left>=-1&&r.right<=win.innerWidth+1,`${id} must fit the viewport width`);}
      assert(doc.documentElement.scrollWidth<=win.innerWidth+1&&doc.body.scrollWidth<=win.innerWidth+1,"no horizontal page overflow at 390px");
      pass("390x844: stats/menu, chat, tab strip, one tabpanel and no horizontal overflow");

      // Exercise panel/body visibility when gameplay or progressive disclosure gates content.
      const battlesBlock=doc.getElementById("battlesBlock"),battlesBody=doc.getElementById("battlesBody");
      const battleWasHidden=battlesBlock.classList.contains("hidden"),battleBodyWasHidden=battlesBody.classList.contains("hidden");
      battlesBlock.classList.add("hidden");battlesBody.classList.add("hidden");
      doc.getElementById("mobileTabBattles").click();await raf(win);
      assert(getComputedStyle(battlesBlock).display==="none"&&getComputedStyle(battlesBody).display==="none","selected battle tab must preserve gated/closed hidden state on its panel and body");
      battlesBlock.classList.toggle("hidden",battleWasHidden);battlesBody.classList.toggle("hidden",battleBodyWasHidden);
      const collapsedEventsBody=doc.getElementById("eventsBody"),eventsWasHidden=collapsedEventsBody.classList.contains("hidden");
      collapsedEventsBody.classList.add("hidden");
      doc.getElementById("mobileTabEvents").click();await raf(win);
      assert(getComputedStyle(collapsedEventsBody).display==="none","selected Events tab must preserve the renderer's collapsed hidden body");
      collapsedEventsBody.classList.toggle("hidden",eventsWasHidden);
      doc.getElementById("mobileTabDm").click();await raf(win);
      pass("fresh/closed/open/closed DM plus gated battle and collapsed Events hidden-state regressions");

      await wait(160);
      const renderCounts={};
      for(const name of ["renderAll","renderDM","renderBattles","renderEvents"]){const original=UI[name];renderCounts[name]=0;if(typeof original==="function")UI[name]=function(...args){renderCounts[name]++;return original.apply(this,args);};}
      const beforeState=snapshotGameUiState(Game.__S);
      const visibilityFixtures={dm:[doc.getElementById("dmBlock"),doc.querySelector("#dmBlock .panelBody")],battles:[doc.getElementById("battlesBlock"),doc.getElementById("battlesBody")],events:[doc.getElementById("eventsBlock"),doc.getElementById("eventsBody")]};
      const hiddenBefore=Object.fromEntries(Object.entries(visibilityFixtures).map(([key,nodes])=>[key,nodes.map(node=>node.classList.contains("hidden"))]));
      Object.values(visibilityFixtures).flat().forEach(node=>node.classList.remove("hidden"));
      const dmDraft=doc.getElementById("dmInput");dmDraft.value="draft survives tab changes";
      doc.getElementById("mobileTabBattles").click();await raf(win);assertOneActive(doc,"battles");
      doc.getElementById("mobileTabEvents").click();await raf(win);assertOneActive(doc,"events");
      doc.getElementById("mobileTabDm").click();await raf(win);assertOneActive(doc,"dm");
      assert(dmDraft.value==="draft survives tab changes","DM draft must survive tab changes");
      assert(snapshotGameUiState(Game.__S)===beforeState,"tab switching must not mutate game state");
      assert(Object.values(renderCounts).every(value=>value===0),`tab switching must not invoke renderers: ${JSON.stringify(renderCounts)}`);
      Object.entries(visibilityFixtures).forEach(([key,nodes])=>nodes.forEach((node,index)=>node.classList.toggle("hidden",hiddenBefore[key][index])));
      pass("one-tap tabs preserve DM draft/game state and invoke no renderers");

      const eventsBody=doc.getElementById("eventsBody");
      const eventSource=doc.getElementById("eventsHeaderCount");
      const oldEventCount=eventSource.textContent;
      const currentBeforeCount=mobileState(win);
      eventSource.textContent=" (7)";await wait(50);
      assert(doc.querySelector('[data-mobile-count="events"]').textContent==="7","Events tab must mirror the existing Events counter");
      assert(mobileState(win)===currentBeforeCount,"new events must not switch tabs");
      eventSource.textContent=oldEventCount;await wait(50);
      const oldContent=eventsBody.innerHTML;
      const eventsOriginallyHidden=eventsBody.classList.contains("hidden");
      eventsBody.classList.remove("hidden");
      eventsBody.innerHTML="";
      for(let i=0;i<30;i++){const row=doc.createElement("div");row.textContent=`test scroll row ${i}`;row.style.height="42px";row.style.flex="0 0 42px";eventsBody.appendChild(row);}
      doc.getElementById("mobileTabEvents").click();await raf(win);
      eventsBody.scrollTop=180;
      assert(eventsBody.scrollTop>0,"active Events content must scroll vertically");
      const preservedScroll=eventsBody.scrollTop;
      const eventProbe=eventsBody.firstElementChild;
      doc.getElementById("mobileTabDm").click();await raf(win);
      doc.getElementById("mobileTabEvents").click();await raf(win);
      assert(eventsBody.scrollTop===preservedScroll,"Events scroll position must survive tab changes");
      assert(eventsBody.firstElementChild===eventProbe,"panel DOM/open card nodes must remain mounted between tabs");
      eventsBody.innerHTML=oldContent;
      eventsBody.classList.toggle("hidden",eventsOriginallyHidden);
      pass("counter mirrors existing source; event updates do not auto-switch; panel scroll and open DOM persist");

      doc.getElementById("mobileTabDm").click();await raf(win);
      const dmBody=doc.querySelector("#dmBlock .panelBody");
      const action=doc.createElement("button");action.type="button";action.title="Mobile help test description";action.textContent="test action";
      let actionCount=0;action.addEventListener("click",()=>actionCount++);dmBody.appendChild(action);
      action.click();assert(actionCount===1,"short tap/click must execute the action immediately once");
      actionCount=0;const actionRect=action.getBoundingClientRect();
      touch(win,"touchstart",action,actionRect.left+2,actionRect.top+2,8891);touch(win,"touchend",action,actionRect.left+2,actionRect.top+2,8891);
      action.dispatchEvent(new win.MouseEvent("click",{bubbles:true,cancelable:true}));
      assert(actionCount===1,"short touch on a game action must remain an action click");actionCount=0;
      touchSwipe(win,doc,action,-90);
      assert(mobileState(win)==="dm","swipe beginning on a button must not switch tabs");
      assert(actionCount===0,"swipe must not activate the game button");
      touchSwipe(win,doc,dmBody.firstElementChild||dmBody,90);
      assert(mobileState(win)==="dm","right swipe at first tab must stop at the edge");
      const battlePanel=doc.getElementById("battlesBlock"),battleBody=doc.getElementById("battlesBody");
      const battlePanelInitiallyHidden=battlePanel.classList.contains("hidden"),battleBodyInitiallyHidden=battleBody.classList.contains("hidden");
      const battleContent=battleBody.innerHTML;
      battlePanel.classList.remove("hidden");battleBody.classList.remove("hidden");
      const eventsPanel=doc.getElementById("eventsBlock"),eventBody=doc.getElementById("eventsBody");
      const eventsPanelInitiallyHidden=eventsPanel.classList.contains("hidden"),eventBodyInitiallyHidden=eventBody.classList.contains("hidden");
      eventsPanel.classList.remove("hidden");eventBody.classList.remove("hidden");
      battleBody.innerHTML="";
      for(let i=0;i<30;i++){const row=doc.createElement("div");row.textContent="test battle scroll row "+i;row.style.height="42px";row.style.flex="0 0 42px";battleBody.appendChild(row);}
      const cardText=doc.createElement("div");cardText.className="battleCard";cardText.textContent="Card body text";let cardActionCount=0;cardText.onclick=()=>cardActionCount++;battleBody.appendChild(cardText);
      const eventText=doc.createElement("div");eventText.className="eventCard";eventText.textContent="Event body text";eventText.onclick=()=>cardActionCount++;eventBody.appendChild(eventText);
      touchSwipe(win,doc,dmBody.firstElementChild||dmBody,-90);
      assert(mobileState(win)==="battles","left swipe in active panel must select next tab");
      touchSwipe(win,doc,cardText,-90);
      assert(mobileState(win)==="events","touch swipe starting on non-control battle-card text must select Events");
      assert(cardActionCount===0,"card background action must not fire after touch swipe");

      doc.getElementById("mobileTabDm").click();await raf(win);
      const beforeResize=doc.getElementById("left").getBoundingClientRect().height;

      action.dispatchEvent(new win.PointerEvent("pointerdown",{bubbles:true,cancelable:true,pointerId:9301,pointerType:"touch",isPrimary:true,button:0,clientX:20,clientY:20}));

      const capCases=[

      const preferred=doc.getElementById("left").getBoundingClientRect().height;

      assert(chatRect.height>0&&shellRect.height>0&&shellRect.bottom<=win.innerHeight+2,"landscape layout keeps chat and panels inside the viewport");
      await setFrameSize(390,420);
      const chatInput=doc.getElementById("chatInput"),send=doc.getElementById("btnSend");

      await setFrameSize(390,844);

      pass("narrow, landscape, keyboard-height resize recovery, and desktop breakpoint");
      await setFrameSize(390,844);
      assertOneActive(doc,"dm");
      pass("restores mobile viewport after desktop breakpoint check");

      result.className="pass";result.textContent=`PASS\n${output.join("\n")}\n\nLIMIT: this browser test dispatches touch-shaped DOM events and reduced viewport sizes; it does not emulate the native iOS Safari gesture recognizer, physical iPhone touch hardware, or keyboard.`;
      document.documentElement.dataset.testResult="pass";
    }catch(error){
      result.className="fail";result.textContent=`FAIL\n${error&&error.stack||error}\n\nPassed before failure:\n${output.join("\n")}`;

    }
