name: stage7-8-memory-sync

on:
  push:
    branches:
      - chatgpt/stage7-8-acceptance-memory-sync-20260806

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-8-acceptance-memory-sync-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply memory synchronization
        run: python tools/tmp_stage7_8_acceptance_memory_sync.py
      - name: Validate and publish
        run: |
          rm tools/tmp_stage7_8_acceptance_memory_sync.py
          rm .github/workflows/tmp-stage7-8-acceptance-memory-sync.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: record accepted Stage 7.8 onboarding"
          git push origin HEAD:chatgpt/stage7-8-acceptance-memory-sync-20260806
