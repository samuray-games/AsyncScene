name: tmp stage7 8 real argument battle

on:
  push:
    branches:
      - chatgpt/stage7-8-real-argument-battle-20260806

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-8-real-argument-battle-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Stage 7.8 reentrancy and recovery fix
        run: python tools/tmp_stage7_8_reentrancy_recovery_fix.py
      - name: Run Stage 7.8 focused regression
        run: python tools/test_stage7_7_preunlock_corridor.py
      - name: Validate exact generated scope
        run: |
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js tools/test_stage7_7_preunlock_corridor.py "
          test "$actual" = "$expected"
      - name: Commit Stage 7.8 hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js tools/test_stage7_7_preunlock_corridor.py
          git commit -m 'fix: make Stage 7 real battle bridge reentrant-safe'
          git push
