name: tmp stage7 8 clean validation

on:
  push:
    branches:
      - chatgpt/stage7-8-real-argument-battle-20260806

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact PR scope
        run: |
          git fetch origin main
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-stage7-8-clean-validation.yml' \
            'AsyncScene/Web/index.html' \
            'AsyncScene/Web/ui/ui-stage7-first-experience.js' \
            'docs/index.html' \
            'docs/ui/ui-stage7-first-experience.js' \
            'tools/test_stage7_4_personalization.py' \
            'tools/test_stage7_7_preunlock_corridor.py' \
            'tools/test_stage7_first_causal_vertical_slice.py' \
            'tools/test_stage7_observed_evidence_harness.py')"
          test "$actual" = "$expected"
      - name: Verify mirrors and syntax
        run: |
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/index.html docs/index.html
          git diff --check origin/main...HEAD
      - name: Run Stage 7 regression matrix
        run: |
          python tools/test_stage7_first_causal_vertical_slice.py
          python tools/test_stage7_observed_evidence_harness.py
          python tools/test_stage7_4_personalization.py
          python tools/test_stage7_essence_modal.py
          python tools/test_stage7_essence_prestart_overlay.py
          python tools/test_stage7_7_preunlock_corridor.py
      - name: Enforce bridge boundary
        run: |
          test "$(git diff --name-only origin/main...HEAD | grep -E '(^|/)(conflict|economy|system|data)\.js$' || true)" = ""
          ! grep -E '\b(fetch|XMLHttpRequest|sendBeacon|WebSocket)\b' AsyncScene/Web/ui/ui-stage7-first-experience.js
