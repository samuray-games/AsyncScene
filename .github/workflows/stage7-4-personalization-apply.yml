name: stage7-4-personalization-apply

on:
  push:
    branches:
      - chatgpt/stage7-4-personalization-20260805
    paths:
      - .github/workflows/stage7-4-personalization-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/stage7-4-personalization-20260805

      - name: Apply Stage 7.4 personalization
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          version = 'stage7_4_personalization_20260805a'
          script_tag = f'  <script defer src="ui/ui-stage7-personalization.js?v={version}"></script>'

          js = r'''// Stage 7.4 start nickname and visible-character personalization.
          window.Game = window.Game || {};

          (() => {
            const G = window.Game;
            const PATCH_FLAG = "__stage7PersonalizationV1";
            if (G[PATCH_FLAG]) return;
            G[PATCH_FLAG] = true;

            const ANTAGONIST_NAME = "Райхан";
            const MEDIATOR_NAME = "Настя";
            const QUESTIONNAIRE_INTRO = "Чтобы открыть полную игру, ответь на 6 простых, но важных вопросов. Они нужны, чтобы проверить, понятно ли, как твой выбор изменил мир.";
            const TEXT_REPLACEMENTS = [
              ["Тест Stage 7.3", "Тест Stage 7.4"],
              ["Кеном", "Райханом"],
              ["Кену", "Райхану"],
              ["Кене", "Райхане"],
              ["Кена", "Райхана"],
              ["Кен", "Райхан"],
              ["Микой", "Настей"],
              ["Мики", "Насти"],
              ["Мике", "Насте"],
              ["Мику", "Настю"],
              ["Мика", "Настя"],
            ];

            function personalizedName(name) {
              if (name === "Кен") return ANTAGONIST_NAME;
              if (name === "Мика") return MEDIATOR_NAME;
              return name;
            }

            function personalizeText(value) {
              let next = String(value == null ? "" : value);
              TEXT_REPLACEMENTS.forEach(([before, after]) => {
                next = next.split(before).join(after);
              });
              return next;
            }

            function ensureNicknameField() {
              const card = document.getElementById("startCard");
              if (!card || document.getElementById("nameInput")) return;
              const anchor = document.getElementById("startBirthYearLabel") || card.querySelector(".startFieldLabel");
              if (!anchor || !anchor.parentNode) return;

              const label = document.createElement("label");
              label.id = "startNameLabel";
              label.className = "startFieldLabel";
              label.htmlFor = "nameInput";
              label.textContent = "Ник";

              const input = document.createElement("input");
              input.id = "nameInput";
              input.className = "input";
              input.type = "text";
              input.maxLength = 24;
              input.autocomplete = "nickname";
              input.autocapitalize = "words";
              input.spellcheck = false;
              input.placeholder = "Как тебя называть?";

              anchor.parentNode.insertBefore(label, anchor);
              anchor.parentNode.insertBefore(input, anchor);
            }

            function renameScenarioPlayers() {
              const states = [G.__S, G.State, G.UI && G.UI.S].filter((value, index, all) => value && all.indexOf(value) === index);
              states.forEach((state) => {
                const players = state && state.players;
                if (!players || typeof players !== "object") return;
                if (players.npc_stage7_ken) players.npc_stage7_ken.name = ANTAGONIST_NAME;
                if (players.npc_stage7_mika) players.npc_stage7_mika.name = MEDIATOR_NAME;
              });
            }

            function wrapPushChat() {
              const UI = G.UI;
              if (!UI || typeof UI.pushChat !== "function" || UI.pushChat.__stage7PersonalizationWrapped) return;
              const original = UI.pushChat;
              const wrapped = function (entry, ...rest) {
                const nextEntry = entry && typeof entry === "object"
                  ? Object.assign({}, entry, { name: personalizedName(entry.name) })
                  : entry;
                return original.call(this, nextEntry, ...rest);
              };
              wrapped.__stage7PersonalizationWrapped = true;
              UI.pushChat = wrapped;
            }

            function wrapStage7Controller() {
              const controller = G.Stage7FirstExperience;
              if (!controller || controller.__stage7PersonalizationWrapped) return;
              ["claimFreshStart", "claimResume"].forEach((methodName) => {
                const original = controller[methodName];
                if (typeof original !== "function") return;
                controller[methodName] = function (...args) {
                  const result = original.apply(this, args);
                  renameScenarioPlayers();
                  return result;
                };
              });
              controller.__stage7PersonalizationWrapped = true;
            }

            function personalizeTextNodes(root) {
              if (!root || typeof document.createTreeWalker !== "function") return;
              const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
              const nodes = [];
              while (walker.nextNode()) nodes.push(walker.currentNode);
              nodes.forEach((node) => {
                const parent = node.parentElement;
                if (parent && ["SCRIPT", "STYLE", "NOSCRIPT", "TEXTAREA"].includes(parent.tagName)) return;
                const next = personalizeText(node.nodeValue);
                if (next !== node.nodeValue) node.nodeValue = next;
              });
            }

            function ensureQuestionnaireIntro(panel) {
              if (!panel) return;
              const button = panel.querySelector('button[data-stage7-action="open-evidence-questionnaire"]');
              if (!button || panel.querySelector(".stage7EvidenceIntro")) return;
              const intro = document.createElement("p");
              intro.className = "stage7Support stage7EvidenceIntro";
              intro.textContent = QUESTIONNAIRE_INTRO;
              button.parentNode.insertBefore(intro, button);
            }

            function apply() {
              ensureNicknameField();
              wrapPushChat();
              wrapStage7Controller();
              renameScenarioPlayers();
              const panel = document.getElementById("stage7FirstExperiencePanel");
              const chatLog = document.getElementById("chatLog");
              if (panel) {
                personalizeTextNodes(panel);
                ensureQuestionnaireIntro(panel);
              }
              if (chatLog) personalizeTextNodes(chatLog);
            }

            let scheduled = false;
            function scheduleApply() {
              if (scheduled) return;
              scheduled = true;
              queueMicrotask(() => {
                scheduled = false;
                apply();
              });
            }

            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", apply, { once: true });
            else apply();

            const observer = new MutationObserver(scheduleApply);
            observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });

            if (!G.__DEV || typeof G.__DEV !== "object") G.__DEV = {};
            G.__DEV.smokeStage7Personalization = () => ({
              ok: !!document.getElementById("nameInput"),
              antagonistName: ANTAGONIST_NAME,
              mediatorName: MEDIATOR_NAME,
              questionnaireIntro: QUESTIONNAIRE_INTRO,
            });
          })();
          '''
          js = '\n'.join(line[10:] if line.startswith('          ') else line for line in js.splitlines()) + '\n'

          for rel in [
              'AsyncScene/Web/ui/ui-stage7-personalization.js',
              'docs/ui/ui-stage7-personalization.js',
          ]:
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(js, encoding='utf-8')

          for rel in ['AsyncScene/Web/index.html', 'docs/index.html']:
              path = root / rel
              text = path.read_text(encoding='utf-8')
              if script_tag in text:
                  continue
              pattern = re.compile(
                  r'(  <script defer src="ui/ui-stage7-first-experience\.js\?v=[^"]+"></script>\n)'
                  r'(  <script defer src="ui/ui-boot\.js\?v=[^"]+"></script>)'
              )
              text, count = pattern.subn(r'\1' + script_tag + r'\n\2', text, count=1)
              if count != 1:
                  raise SystemExit(f'failed to wire personalization script in {rel}')
              path.write_text(text, encoding='utf-8')

          test = r'''#!/usr/bin/env python3
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SRC_JS = ROOT / "AsyncScene/Web/ui/ui-stage7-personalization.js"
          DOCS_JS = ROOT / "docs/ui/ui-stage7-personalization.js"
          SRC_INDEX = ROOT / "AsyncScene/Web/index.html"
          DOCS_INDEX = ROOT / "docs/index.html"
          CONTROLLER = ROOT / "AsyncScene/Web/ui/ui-stage7-first-experience.js"
          MARKER = '<script defer src="ui/ui-stage7-personalization.js?v=stage7_4_personalization_20260805a"></script>'

          source = SRC_JS.read_text(encoding="utf-8")
          deployed = DOCS_JS.read_text(encoding="utf-8")
          assert source == deployed, "source/docs personalization JS drift"

          for index_path in (SRC_INDEX, DOCS_INDEX):
              index = index_path.read_text(encoding="utf-8")
              assert index.count(MARKER) == 1, f"missing or duplicate personalization wiring in {index_path}"
              assert index.index("ui-stage7-first-experience.js") < index.index(MARKER) < index.index("ui-boot.js"), f"wrong script order in {index_path}"

          required = [
              'label.textContent = "Ник"',
              'input.id = "nameInput"',
              'input.placeholder = "Как тебя называть?"',
              '["Кен", "Райхан"]',
              '["Мика", "Настя"]',
              'players.npc_stage7_ken.name = ANTAGONIST_NAME',
              'players.npc_stage7_mika.name = MEDIATOR_NAME',
              'button[data-stage7-action="open-evidence-questionnaire"]',
              'Чтобы открыть полную игру, ответь на 6 простых, но важных вопросов.',
              'Тест Stage 7.4',
          ]
          for token in required:
              assert token in source, f"missing Stage 7.4 contract token: {token}"

          for forbidden in ("fetch(", "XMLHttpRequest", "sendBeacon", "WebSocket"):
              assert forbidden not in source, f"network API forbidden in personalization layer: {forbidden}"

          controller = CONTROLLER.read_text(encoding="utf-8")
          assert 'change: "Кен убедил одного человека поддержать его."' in controller
          assert 'hook: "Мика просит доказательство. Сначала ответить ей или поговорить с Олегом?"' in controller
          assert 'function getStartName(UI)' in (ROOT / "AsyncScene/Web/ui/ui-boot.js").read_text(encoding="utf-8")
          assert 'document.getElementById("nameInput")' in (ROOT / "AsyncScene/Web/ui/ui-boot.js").read_text(encoding="utf-8")

          print("STAGE7_4_PERSONALIZATION_OK")
          '''
          test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines()) + '\n'
          test_path = root / 'tools/test_stage7_4_personalization.py'
          test_path.write_text(test, encoding='utf-8')
          test_path.chmod(0o755)
          PY

      - name: Validate Stage 7.4
        shell: bash
        run: |
          python3 tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_observed_evidence_harness.py
          python3 tools/test_stage7_essence_modal.py
          python3 tools/test_stage7_essence_prestart_overlay.py
          python3 tools/test_stage7_4_personalization.py
          node --check AsyncScene/Web/ui/ui-stage7-personalization.js
          node --check docs/ui/ui-stage7-personalization.js
          cmp -s AsyncScene/Web/ui/ui-stage7-personalization.js docs/ui/ui-stage7-personalization.js
          cmp -s AsyncScene/Web/index.html docs/index.html

      - name: Commit applied changes
        shell: bash
        run: |
          rm -f .github/workflows/stage7-4-personalization-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AsyncScene/Web/index.html docs/index.html \
            AsyncScene/Web/ui/ui-stage7-personalization.js \
            docs/ui/ui-stage7-personalization.js \
            tools/test_stage7_4_personalization.py \
            .github/workflows/stage7-4-personalization-apply.yml
          git commit -m "feat: personalize Stage 7 onboarding"
          git push origin HEAD:chatgpt/stage7-4-personalization-20260805
