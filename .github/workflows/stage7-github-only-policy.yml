name: Stage 7 GitHub-only policy sync

on:
  push:
    branches:
      - chatgpt/github-only-workflow-20260805

permissions:
  contents: write

jobs:
  sync-policy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/github-only-workflow-20260805
          fetch-depth: 0

      - name: Patch repository policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## 0. Bridge command aliases\n'
          if anchor not in text:
              raise SystemExit('missing AGENTS.md insertion anchor')

          section = '''## GitHub-only default workflow\n\nThis section supersedes conflicting Codex, local-clone, `local.handoff`, local-worktree and local-validation requirements elsewhere in this file for ordinary non-bridge Asynchronia work. The exact reserved commands `мост 1`, `мост 2`, and `мост 3` retain their dedicated bridge protocol.\n\n- Ordinary implementation uses an isolated remote GitHub branch created from the current fetched `main`.\n- Files may be edited through the authorized GitHub execution surface without a local repository or Codex session.\n- Required validation runs in GitHub Actions. Failed, cancelled or missing required checks block merge.\n- Exact changed-file scope, mirror parity, protected mechanics, settlement traceability and persistence invariants remain mandatory.\n- Direct task writes to `main` remain forbidden. Changes enter `main` only through a reviewed pull request.\n- After merge, GitHub Pages deployment is verified and every user-visible runtime change remains subject to the user-owned Safari acceptance gate.\n- Codex is optional and may be used for unusually deep local debugging or large refactors, but its absence must not block ordinary Asynchronia work.\n- The acting assistant remains responsible for sequencing, implementation coordination, evidence and completion. Work must not be shifted to the user merely because a local execution surface is unavailable.\n\n'''
          if '## GitHub-only default workflow\n' not in text:
              text = text.replace(anchor, section + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate policy patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('AGENTS.md').read_text(encoding='utf-8')
          required = [
              '## GitHub-only default workflow',
              'local repository or Codex session',
              'Required validation runs in GitHub Actions',
              'Direct task writes to `main` remain forbidden',
              'user-owned Safari acceptance gate',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing policy clauses: {missing}')
          print('PASS_GITHUB_ONLY_POLICY')
          PY

      - name: Commit policy and remove bootstrap workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage7-github-only-policy.yml
          git add AGENTS.md
          git diff --cached --check
          git commit -m 'policy: adopt GitHub-only development workflow'
          git push origin HEAD:chatgpt/github-only-workflow-20260805
