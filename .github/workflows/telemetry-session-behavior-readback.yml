name: telemetry-session-behavior-readback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-session-behavior-readback
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: telemetry-private-alpha
    env:
      TELEMETRY_OWNER_TOKEN: ${{ secrets.TELEMETRY_OWNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct Safari2234 behavior without exposing raw production data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$TELEMETRY_OWNER_TOKEN"
          RUN_DIR="$RUNNER_TEMP/telemetry-session-behavior-readback"
          mkdir -p "$RUN_DIR"
          AUTH_HEADER="$RUN_DIR/authorization-header"
          SESSIONS="$RUN_DIR/sessions.json"
          EXPORT="$RUN_DIR/export.ndjson"
          trap 'rm -f "$AUTH_HEADER" "$SESSIONS" "$EXPORT"' EXIT
          printf 'Authorization: Bearer %s\n' "$TELEMETRY_OWNER_TOKEN" > "$AUTH_HEADER"
          ORIGIN="$(node -e 'const fs=require("fs"); const text=fs.readFileSync("docs/telemetry-config.js","utf8"); const match=text.match(/endpointOrigin:\s*"(https:\/\/[^"/]+)"/); if (!match) process.exit(1); const url=new URL(match[1]); if (url.protocol !== "https:" || url.pathname !== "/") process.exit(1); process.stdout.write(url.origin);')"
          curl --fail --silent --show-error --header "@$AUTH_HEADER" "$ORIGIN/v1/admin/sessions?days=30&limit=200" --output "$SESSIONS"
          curl --fail --silent --show-error --header "@$AUTH_HEADER" "$ORIGIN/v1/admin/export?days=30&limit=10000" --output "$EXPORT"
          node - "$SESSIONS" "$EXPORT" <<'NODE'
          const [sessionsPath, exportPath] = process.argv.slice(2);
          const fs = require("fs");
          const crypto = require("crypto");
          const nickname = "Safari2234";
          const fail = (code) => { console.error(`BEHAVIOR_READBACK_FAIL:${code}`); process.exit(1); };
          const parseBag = (text) => {
            try {
              const value = JSON.parse(text || "{}");
              return value && typeof value === "object" && !Array.isArray(value) ? value : {};
            } catch (_) {
              fail("INVALID_EVENT_BAG");
            }
          };
          const clean = (value) => Object.fromEntries(Object.entries(value).filter(([, item]) => item !== null && item !== undefined));
          const behaviorOnly = (value) => Object.fromEntries(Object.entries(value).filter(([key]) => key !== "priorSessionId"));
          try {
            const sessionsResponse = JSON.parse(fs.readFileSync(sessionsPath, "utf8"));
            if (!sessionsResponse.ok || !Array.isArray(sessionsResponse.sessions)) fail("SESSIONS_CONTRACT");
            const matches = sessionsResponse.sessions.filter((session) => session && session.nickname === nickname);
            if (matches.length !== 1) fail("SAFARI2234_SESSION_COUNT");
            const session = matches[0];
            const records = fs.readFileSync(exportPath, "utf8").trim().split("\n").filter(Boolean).map((line) => JSON.parse(line));
            const events = records
              .filter((record) => record.recordType === "event" && record.event && record.event.session_id === session.session_id)
              .map((record) => ({ ...record.event, context: parseBag(record.event.context_json), payload: parseBag(record.event.payload_json) }))
              .sort((a, b) => a.occurred_at - b.occurred_at || a.sequence - b.sequence || a.monotonic_ms - b.monotonic_ms || a.event_id.localeCompare(b.event_id));
            if (events.length !== session.event_count || events.length !== 146) fail("EVENT_COUNT_MISMATCH");
            if (new Set(events.map((event) => event.event_id)).size !== events.length) fail("DUPLICATE_EVENT_ID");

            const first = events[0];
            const last = events.at(-1);
            const firstAt = first.occurred_at;
            const eventCounts = {};
            const screenVisits = {};
            const dwellByScreen = {};
            const screenChronology = [];
            const interactions = [];
            const lifecycle = [];
            let explicitSessionDurationMs = null;
            let explicitSessionForegroundMs = null;

            for (const event of events) {
              eventCounts[event.event_type] = (eventCounts[event.event_type] || 0) + 1;
              const at = new Date(event.occurred_at).toISOString();
              const offsetMs = event.occurred_at - firstAt;
              const payload = event.payload;
              const screenId = event.screen_id || payload.screenId || event.context.screenId || null;
              if (event.event_type === "screen_enter") {
                screenVisits[screenId] = (screenVisits[screenId] || 0) + 1;
                screenChronology.push(clean({ at, offsetMs, kind: "enter", screenId, reason: payload.reason }));
              } else if (event.event_type === "screen_exit") {
                if (Number.isSafeInteger(payload.foregroundDwellMs)) {
                  dwellByScreen[screenId] = (dwellByScreen[screenId] || 0) + payload.foregroundDwellMs;
                }
                screenChronology.push(clean({ at, offsetMs, kind: "exit", screenId, foregroundDwellMs: payload.foregroundDwellMs, reason: payload.reason }));
              }

              if (["button_click", "action", "choice_selected", "state_changed", "question_shown", "question_answered", "cycle_started", "cycle_completed"].includes(event.event_type)) {
                interactions.push(clean({
                  at,
                  offsetMs,
                  type: event.event_type,
                  screenId,
                  modalId: event.modal_id || payload.modalId || event.context.modalId,
                  flowId: event.flow_id || payload.flowId,
                  stateId: event.state_id || payload.stateId,
                  fromStateId: event.from_state_id || payload.fromStateId,
                  toStateId: event.to_state_id || payload.toStateId,
                  actionId: event.action_id || payload.actionId,
                  elementId: payload.elementId,
                  choiceId: event.choice_id || payload.choiceId,
                  questionId: event.question_id || payload.questionId,
                  answerId: event.answer_id || payload.answerId,
                  cycleId: event.cycle_id || payload.cycleId,
                  battleId: event.battle_id || payload.battleId,
                  outcomeId: event.outcome_id || payload.outcomeId,
                  foregroundDwellMs: payload.foregroundDwellMs,
                  details: clean(Object.fromEntries(Object.entries(payload).filter(([key]) => !["actionId", "elementId", "choiceId", "questionId", "answerId", "cycleId", "flowId", "stateId", "fromStateId", "toStateId", "battleId", "outcomeId", "foregroundDwellMs"].includes(key))))
                }));
              }

              if (["session_start", "session_end", "visibility_hidden", "visibility_visible", "abandon", "return", "modal_open", "modal_close"].includes(event.event_type)) {
                lifecycle.push(clean({ at, offsetMs, type: event.event_type, screenId, modalId: event.modal_id || payload.modalId || event.context.modalId, details: behaviorOnly(payload) }));
              }
              if (event.event_type === "session_end") {
                if (Number.isSafeInteger(payload.durationMs)) explicitSessionDurationMs = payload.durationMs;
                if (Number.isSafeInteger(payload.foregroundDwellMs)) explicitSessionForegroundMs = payload.foregroundDwellMs;
              }
            }

            const pageViewCount = new Set(events.map((event) => event.page_view_id)).size;
            const report = {
              status: "PASS",
              nickname,
              city: session.city,
              sessionHash: crypto.createHash("sha256").update(session.session_id).digest("hex").slice(0, 16),
              eventCount: events.length,
              batchCount: new Set(events.map((event) => event.batch_id)).size,
              pageViewCount,
              startedAt: new Date(first.occurred_at).toISOString(),
              endedAt: new Date(last.occurred_at).toISOString(),
              observedSpanMs: last.occurred_at - first.occurred_at,
              explicitSessionDurationMs,
              explicitSessionForegroundMs,
              eventCounts,
              screenVisits,
              dwellByScreen,
              screenChronology,
              interactions,
              lifecycle,
              finalEvent: clean({
                at: new Date(last.occurred_at).toISOString(),
                type: last.event_type,
                screenId: last.screen_id || last.payload.screenId || last.context.screenId,
                questionId: last.question_id || last.payload.questionId || last.context.questionId,
                cycleId: last.cycle_id || last.payload.cycleId || last.context.cycleId,
                actionId: last.action_id || last.payload.actionId,
                choiceId: last.choice_id || last.payload.choiceId,
                reason: last.payload.reason,
                details: behaviorOnly(last.payload)
              })
            };
            console.log(`SAFARI2234_BEHAVIOR=${JSON.stringify(report)}`);
          } catch (error) {
            if (String(error && error.message || error).startsWith("BEHAVIOR_READBACK_FAIL:")) throw error;
            fail("UNEXPECTED_PARSE_OR_CONTRACT_ERROR");
          }
          NODE
