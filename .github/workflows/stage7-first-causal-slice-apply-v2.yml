name: Apply Stage 7 first causal slice v2

on:
  push:
    branches:
      - chatgpt/stage7-first-causal-slice-20260805

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-first-causal-slice-20260805
          fetch-depth: 0

      - name: Normalize mirrors and patch boot wiring
        shell: bash
        run: |
          cp AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cp AsyncScene/Web/ui/ui-stage7-first-experience.css docs/ui/ui-stage7-first-experience.css
          cp AsyncScene/Web/ui/ui-boot.js docs/ui/ui-boot.js
          python3 - <<'PY'
          from pathlib import Path

          source_index = Path('AsyncScene/Web/index.html')
          docs_index = Path('docs/index.html')
          source_boot = Path('AsyncScene/Web/ui/ui-boot.js')
          docs_boot = Path('docs/ui/ui-boot.js')

          if source_index.read_bytes() != docs_index.read_bytes():
              raise SystemExit('index mirrors differ before patch')

          index = source_index.read_text(encoding='utf-8')
          css_anchor = '  <link rel="stylesheet" href="ui/ui-stage7-essence.css?v=stage7_essence_modal_20260805a" />\n'
          css_line = '  <link rel="stylesheet" href="ui/ui-stage7-first-experience.css?v=stage7_first_causal_slice_20260805a" />\n'
          if css_line not in index:
              if css_anchor not in index:
                  raise SystemExit('index CSS anchor missing')
              index = index.replace(css_anchor, css_anchor + css_line, 1)

          script_anchor = ''.join([
              '  <script defer src="ui/ui-loops.js?v=stage6_step9_five_profile_runtime_repair_20260727a"></script>\n',
              '  <script defer src="ui/ui-boot.js?v=stage6_step9_five_profile_runtime_repair_20260727a"></script>\n',
          ])
          script_replacement = ''.join([
              '  <script defer src="ui/ui-loops.js?v=stage6_step9_five_profile_runtime_repair_20260727a"></script>\n',
              '  <script defer src="ui/ui-stage7-first-experience.js?v=stage7_first_causal_slice_20260805a"></script>\n',
              '  <script defer src="ui/ui-boot.js?v=stage7_first_causal_slice_20260805a"></script>\n',
          ])
          if 'ui/ui-stage7-first-experience.js?v=stage7_first_causal_slice_20260805a' not in index:
              if script_anchor not in index:
                  raise SystemExit('index script anchor missing')
              index = index.replace(script_anchor, script_replacement, 1)
          source_index.write_text(index, encoding='utf-8')
          docs_index.write_text(index, encoding='utf-8')

          boot = source_boot.read_text(encoding='utf-8')
          resume_anchor = '\n'.join([
              '        if (UI.applyMobilePanelDefaults) UI.applyMobilePanelDefaults();',
              '        if (UI.startLoops) UI.startLoops();',
              '        UI.renderAll && UI.renderAll();',
              '        ensureStartScreenHidden(UI);',
              '        return;',
              '',
          ])
          resume_replacement = '\n'.join([
              '        if (UI.applyMobilePanelDefaults) UI.applyMobilePanelDefaults();',
              '        let normalWorldStarted = false;',
              '        const startNormalWorld = () => {',
              '          if (normalWorldStarted) return;',
              '          normalWorldStarted = true;',
              '          if (UI.startLoops) UI.startLoops();',
              '          UI.renderAll && UI.renderAll();',
              '        };',
              '        const firstExperience = G.Stage7FirstExperience;',
              '        if (firstExperience && typeof firstExperience.claimResume === "function") {',
              '          const claim = firstExperience.claimResume({ UI, state: S, playerName: name, startNormalWorld });',
              '          if (claim && claim.claimed === true) {',
              '            UI.renderAll && UI.renderAll();',
              '            ensureStartScreenHidden(UI);',
              '            return;',
              '          }',
              '        }',
              '        startNormalWorld();',
              '        ensureStartScreenHidden(UI);',
              '        return;',
              '',
          ])
          if 'claimResume({ UI, state: S, playerName: name, startNormalWorld })' not in boot:
              if resume_anchor not in boot:
                  raise SystemExit('resume boot anchor missing')
              boot = boot.replace(resume_anchor, resume_replacement, 1)

          fresh_anchor = '\n'.join([
              '      // Hide start again before rendering so later UI work cannot re-show it.',
              '      ensureStartScreenHidden(UI);',
              '',
              '      // Welcome',
              '',
          ])
          fresh_replacement = '\n'.join([
              '      // Hide start again before rendering so later UI work cannot re-show it.',
              '      ensureStartScreenHidden(UI);',
              '',
              '      let normalWorldStarted = false;',
              '      const startNormalWorld = () => {',
              '        if (normalWorldStarted) return;',
              '        normalWorldStarted = true;',
              '        if (UI.startLoops) UI.startLoops();',
              '        UI.renderAll && UI.renderAll();',
              '      };',
              '      const firstExperience = G.Stage7FirstExperience;',
              '      if (firstExperience && typeof firstExperience.claimFreshStart === "function") {',
              '        const claim = firstExperience.claimFreshStart({ UI, state: S, playerName: name, startNormalWorld });',
              '        if (claim && claim.claimed === true) {',
              '          UI.renderAll && UI.renderAll();',
              '          ensureStartScreenHidden(UI);',
              '          return;',
              '        }',
              '      }',
              '',
              '      // Welcome',
              '',
          ])
          if 'claimFreshStart({ UI, state: S, playerName: name, startNormalWorld })' not in boot:
              if fresh_anchor not in boot:
                  raise SystemExit('fresh boot anchor missing')
              boot = boot.replace(fresh_anchor, fresh_replacement, 1)

          source_boot.write_text(boot, encoding='utf-8')
          docs_boot.write_text(boot, encoding='utf-8')
          PY

      - name: Validate Stage 7.1
        shell: bash
        run: |
          python3 -m py_compile tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_essence_modal.py
          python3 tools/test_stage7_essence_prestart_overlay.py
          python3 tools/test_step9_ui_boot_forbidden_state_access.py
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          cmp -s AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp -s AsyncScene/Web/ui/ui-stage7-first-experience.css docs/ui/ui-stage7-first-experience.css
          cmp -s AsyncScene/Web/index.html docs/index.html
          cmp -s AsyncScene/Web/ui/ui-boot.js docs/ui/ui-boot.js
          git diff --check

      - name: Commit mirrored runtime integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/ui/ui-stage7-first-experience.js \
            docs/ui/ui-stage7-first-experience.css \
            AsyncScene/Web/index.html \
            docs/index.html \
            AsyncScene/Web/ui/ui-boot.js \
            docs/ui/ui-boot.js
          python3 - <<'PY'
          import subprocess
          expected = {
              'docs/ui/ui-stage7-first-experience.js',
              'docs/ui/ui-stage7-first-experience.css',
              'AsyncScene/Web/index.html',
              'docs/index.html',
              'AsyncScene/Web/ui/ui-boot.js',
              'docs/ui/ui-boot.js',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'integration scope mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          print('PASS_STAGE7_INTEGRATION_SCOPE')
          PY
          git diff --cached --check
          git commit -m 'feat: integrate first causal Stage 7 experience'
          git push origin HEAD:chatgpt/stage7-first-causal-slice-20260805
