name: stage7-10-persistence-repair

on:
  push:
    branches:
      - chatgpt/stage7-10-accuse-ken-payoffs-20260806

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-10-accuse-ken-payoffs-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply persisted defense snapshot repair
        run: python tools/tmp_stage7_10_persistence_repair.py
      - name: Validate runtime mirrors and syntax
        run: |
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          node --check AsyncScene/Web/ui/ui-battles.js
          node --check docs/ui/ui-battles.js
          cmp AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/ui/ui-battles.js docs/ui/ui-battles.js
          cmp AsyncScene/Web/index.html docs/index.html
          git diff --check
      - name: Run focused and Stage 7 regression matrix
        run: |
          for test_file in \
            tools/test_stage7_10_accuse_ken_payoffs.py \
            tools/test_stage7_9_deny_evidence_payoff.py \
            tools/test_stage7_first_causal_vertical_slice.py \
            tools/test_stage7_observed_evidence_harness.py \
            tools/test_stage7_4_personalization.py \
            tools/test_stage7_essence_modal.py \
            tools/test_stage7_essence_prestart_overlay.py \
            tools/test_stage7_7_preunlock_corridor.py
          do
            set +e
            output="$(python "$test_file" 2>&1)"
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 0 ]; then
              compact="$(printf '%s' "$output" | tail -c 6000 | tr '\n' ' ')"
              echo "::error title=$test_file failed::$compact"
              exit "$status"
            fi
          done
      - name: Enforce exact final scope and protected boundary
        run: |
          ! grep -E '\b(fetch|XMLHttpRequest|sendBeacon|WebSocket)\b' AsyncScene/Web/ui/ui-stage7-first-experience.js
          rm tools/tmp_stage7_10_persistence_repair.py
          rm .github/workflows/tmp-stage7-10-persistence-repair.yml
          git fetch origin main
          actual="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' \
            'AsyncScene/Web/index.html' \
            'AsyncScene/Web/ui/ui-battles.js' \
            'AsyncScene/Web/ui/ui-stage7-first-experience.js' \
            'docs/index.html' \
            'docs/ui/ui-battles.js' \
            'docs/ui/ui-stage7-first-experience.js' \
            'tools/test_stage7_7_preunlock_corridor.py' \
            'tools/test_stage7_9_deny_evidence_payoff.py' \
            'tools/test_stage7_10_accuse_ken_payoffs.py' \
            'tools/test_stage7_first_causal_vertical_slice.py' \
            'tools/test_stage7_observed_evidence_harness.py' | sort)"
          test "$actual" = "$expected"
          test "$(printf '%s\n' "$actual" | grep -E '(^|/)(conflict-core|conflict-api|conflict-economy|conflict-arguments|economy|system|data)\.js$' || true)" = ""
          git diff --check
      - name: Commit validated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: persist rematch defense choices across refresh"
          git push origin HEAD:chatgpt/stage7-10-accuse-ken-payoffs-20260806
