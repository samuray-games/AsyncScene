name: Asynchronia Pages Legacy Recovery

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/asynchronia-pages-recovery.yml
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional exact repository SHA whose docs directory must be published
        required: false
        type: string
      expected_marker:
        description: Optional marker that must exist in docs/index.html and the published page
        required: false
        type: string

permissions:
  contents: read
  pages: write

concurrency:
  group: asynchronia-pages-legacy-recovery
  cancel-in-progress: false

jobs:
  recover-legacy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Verify requested artifact
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EXPECTED_MARKER: ${{ inputs.expected_marker || 'stage7_14_durable_aftermath_dm_contact_20260807a' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f docs/index.html
          grep -Fq "$EXPECTED_MARKER" docs/index.html
          echo "PAGES_SOURCE_SHA=$SOURCE_SHA"
          echo "PAGES_EXPECTED_MARKER=$EXPECTED_MARKER"

      - name: Recover legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EXPECTED_MARKER: ${{ inputs.expected_marker || 'stage7_14_durable_aftermath_dm_contact_20260807a' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          pages_json="$(gh api "/repos/${REPOSITORY}/pages")"
          build_type="$(printf '%s' "$pages_json" | jq -r '.build_type')"
          source_branch="$(printf '%s' "$pages_json" | jq -r '.source.branch')"
          source_path="$(printf '%s' "$pages_json" | jq -r '.source.path')"
          page_url="$(printf '%s' "$pages_json" | jq -r '.html_url')"

          echo "PAGES_BUILD_TYPE=$build_type"
          echo "PAGES_SOURCE_BRANCH=$source_branch"
          echo "PAGES_SOURCE_PATH=$source_path"
          test "$build_type" = "legacy"
          test "$source_branch" = "main"
          test "$source_path" = "/docs"

          # These are the three provider-side deployment versions left stuck by the
          # Stage 7.13 recovery attempts. Cancelling them is best-effort because the
          # legacy Pages source remains main:/docs and is authoritative.
          stale_versions=(
            "69a1137c6ab4ede2a0d1e420cde477f29b0b2949"
            "5ecc52af429be01ec08aa2ef3c8b73213176e8e1"
            "55147a9fa895233865d5cc4533a1d784d61576e6"
          )

          for version in "${stale_versions[@]}"; do
            status="$(gh api "/repos/${REPOSITORY}/pages/deployments/${version}" --jq '.status' 2>/dev/null || true)"
            echo "STALE_DEPLOYMENT_BEFORE_CANCEL ${version} ${status:-missing}"
            if [ "$status" = "deployment_in_progress" ]; then
              gh api --method POST "/repos/${REPOSITORY}/pages/deployments/${version}/cancel" >/dev/null 2>&1 || true
            fi
          done

          sleep 15

          latest_json="$(gh api "/repos/${REPOSITORY}/pages/builds/latest")"
          latest_commit="$(printf '%s' "$latest_json" | jq -r '.commit // empty')"
          latest_status="$(printf '%s' "$latest_json" | jq -r '.status // empty')"
          echo "LATEST_BUILD_BEFORE_RECOVERY_COMMIT=${latest_commit:-none}"
          echo "LATEST_BUILD_BEFORE_RECOVERY_STATUS=${latest_status:-none}"

          if [ "$latest_commit" != "$SOURCE_SHA" ] || [ "$latest_status" = "errored" ]; then
            echo "REQUESTING_LEGACY_PAGES_BUILD"
            gh api --method POST "/repos/${REPOSITORY}/pages/builds" >/tmp/pages-build-request.json
            cat /tmp/pages-build-request.json
          fi

          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            latest_json="$(gh api "/repos/${REPOSITORY}/pages/builds/latest")"
            latest_commit="$(printf '%s' "$latest_json" | jq -r '.commit // empty')"
            latest_status="$(printf '%s' "$latest_json" | jq -r '.status // empty')"
            echo "LEGACY_PAGES_BUILD_STATUS commit=${latest_commit:-none} status=${latest_status:-none}"

            if [ "$latest_commit" != "$SOURCE_SHA" ]; then
              sleep 5
              continue
            fi

            case "$latest_status" in
              built)
                break
                ;;
              errored)
                printf '%s\n' "$latest_json" >&2
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          latest_json="$(gh api "/repos/${REPOSITORY}/pages/builds/latest")"
          test "$(printf '%s' "$latest_json" | jq -r '.commit')" = "$SOURCE_SHA"
          test "$(printf '%s' "$latest_json" | jq -r '.status')" = "built"

          curl -fsSL "${page_url}?asynchronia_pages_recovery=${SOURCE_SHA}" -o /tmp/published-index.html
          grep -Fq "$EXPECTED_MARKER" /tmp/published-index.html
          echo "ASYNCHRONIA_LEGACY_PAGES_RECOVERY_SUCCEEDED"
