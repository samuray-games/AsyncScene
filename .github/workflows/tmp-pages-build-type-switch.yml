name: pages-build-type-switch

on:
  push:
    branches:
      - chatgpt/pages-build-type-switch-20260806

permissions:
  contents: read
  pages: write

jobs:
  switch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages from legacy to workflow mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/samuray-games/AsyncScene/pages \
            -f build_type=workflow
          build_type="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/samuray-games/AsyncScene/pages \
            --jq '.build_type')"
          test "$build_type" = "workflow"
          echo "PAGES_BUILD_TYPE=$build_type"
          echo "ASYNCHRONIA_PAGES_WORKFLOW_MODE_ENABLED"
