name: stage7-12-pass-memory-sync

on:
  push:
    branches:
      - chatgpt/stage7-12-pass-memory-sync-20260806

permissions:
  contents: write

jobs:
  sync-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-12-pass-memory-sync-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply accepted Stage 7.12 memory sync
        run: python3 tools/tmp_stage7_12_pass_memory_sync.py
      - name: Validate exact documentation scope
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              'TASKS.md',
              'PROJECT_MEMORY.md',
              '.ai-memory/CURRENT.md',
              '.ai-memory/CANON.md',
              '.ai-memory/WORKFLOWS.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'exact scope mismatch: changed={sorted(changed)} expected={sorted(expected)}')

          rev = '2026-08-06-2101-JST'
          merge = '4e27aa0d690127c7b495c9c690026f7bf58c621a'
          nxt = 'AWAIT_EXPLICIT_USER_DIRECTION_FOR_NEXT_STAGE7_PRODUCT_SLICE'
          for path in expected:
              text = Path(path).read_text(encoding='utf-8')
              if rev not in text or nxt not in text:
                  raise SystemExit(f'missing current revision/next action in {path}')
          project = Path('PROJECT_MEMORY.md').read_text(encoding='utf-8')
          current = Path('.ai-memory/CURRENT.md').read_text(encoding='utf-8')
          canon = Path('.ai-memory/CANON.md').read_text(encoding='utf-8')
          workflows = Path('.ai-memory/WORKFLOWS.md').read_text(encoding='utf-8')
          tasks = Path('TASKS.md').read_text(encoding='utf-8')
          assert project.count('STAGE7_12_USER_VERDICT: PASS') == 1
          assert current.count('STAGE7_12_USER_VERDICT: PASS') == 1
          assert canon.count('## Accepted Stage 7.12 product slice') == 1
          assert canon.count('CURRENT_NEXT_ACTION: ' + nxt) == 1
          assert 'ACTIVE_TASK: NONE / AWAITING_EXPLICIT_USER_DIRECTION' in current
          assert 'STAGE7_12_FIRST_REAL_BATTLE_AFTERMATH_CONSEQUENCE' not in current
          assert merge in project and merge in current and merge in canon and merge in workflows and merge in tasks
          assert 'AsyncScene/Web/' not in '\n'.join(changed)
          assert 'docs/' not in '\n'.join(changed)
          print('STAGE7_12_PASS_MEMORY_SYNC_SCOPE_OK')
          PY
      - name: Commit synchronized memory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TASKS.md PROJECT_MEMORY.md .ai-memory/CURRENT.md .ai-memory/CANON.md .ai-memory/WORKFLOWS.md
          git commit -m 'docs: record accepted Stage 7.12 aftermath'
          git push origin HEAD:chatgpt/stage7-12-pass-memory-sync-20260806
