name: TEMP Stage7.14 implementation

on:
  push:
    branches:
      - chatgpt/stage7-14-durable-aftermath-dm-contact-20260807

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-14-durable-aftermath-dm-contact-20260807
          fetch-depth: 0
      - name: Patch Stage 7.14
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/stage714_patch.py
          python3 /tmp/stage714_patch.py
      - name: Validate Stage 7.14
        shell: bash
        run: |
          set -euo pipefail
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          python3 tools/test_stage7_7_preunlock_corridor.py
          python3 tools/test_stage7_9_deny_evidence_payoff.py
          python3 tools/test_stage7_10_accuse_ken_payoffs.py
          python3 tools/test_stage7_11_pay_branch_payoffs.py
          python3 tools/test_stage7_12_first_real_battle_aftermath.py
          python3 tools/test_stage7_13_aftermath_dm_followup.py
          python3 tools/test_stage7_14_durable_aftermath_dm_contact.py
          python3 tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_observed_evidence_harness.py
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/__temp_stage7_14_implementation.yml
          expected='AsyncScene/Web/index.html AsyncScene/Web/ui/ui-stage7-first-experience.js docs/index.html docs/ui/ui-stage7-first-experience.js tools/test_stage7_14_durable_aftermath_dm_contact.py .github/workflows/__temp_stage7_14_implementation.yml'
          for path in $expected; do
            git status --short -- "$path" | grep -q .
          done
          test "$(git status --short | wc -l | tr -d ' ')" = "6"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: keep aftermath DM contact across refresh'
          git push origin HEAD:chatgpt/stage7-14-durable-aftermath-dm-contact-20260807
