name: ai-forensics-evidence

# Security containment: forensic evidence publication is disabled.
# Reintroduction requires explicit owner authorization and security review.
on:
  workflow_dispatch:

permissions: {}

jobs:
  capture:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Disabled by security containment
        run: echo "AI_FORENSICS_PUBLISHING_DISABLED"
