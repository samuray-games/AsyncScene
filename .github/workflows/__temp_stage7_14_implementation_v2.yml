name: TEMP Stage7.14 implementation v2

on:
  push:
    branches:
      - chatgpt/stage7-14-durable-aftermath-dm-contact-20260807

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-14-durable-aftermath-dm-contact-20260807
          fetch-depth: 0

      - name: Patch Stage 7.14 controller mirrors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controllers = [
              Path("AsyncScene/Web/ui/ui-stage7-first-experience.js"),
              Path("docs/ui/ui-stage7-first-experience.js"),
          ]

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def patch_controller(text):
              text = replace_once(
                  text,
                  '  const FIRST_BATTLE_AFTERMATH_DM_ID = "stage7_first_real_battle_dm_followup_v1";\n',
                  '  const FIRST_BATTLE_AFTERMATH_DM_ID = "stage7_first_real_battle_dm_followup_v1";\n'
                  '  const FIRST_BATTLE_AFTERMATH_DM_CONTACT_ID = "stage7_first_real_battle_dm_contact_v1";\n',
                  "contact constant",
              )

              contact_logic = r'''
  function getFirstBattleAftermathDmContactRecord() {
    const current = snapshot || loadSnapshot();
    if (!current || current.onboardingUnlocked !== true) return null;
    const bridge = sanitizeRealBattleBridge(current.realBattleBridge);
    if (bridge.status !== "completed"
      || bridge.aftermathStatus !== "acknowledged"
      || !["pending", "delivered"].includes(bridge.aftermathDmStatus)) return null;
    const branchId = RESPONSE_IDS.includes(bridge.aftermathBranchId)
      ? bridge.aftermathBranchId
      : bridge.branchId;
    const targetNpcId = bridge.aftermathTargetNpcId || (branchId ? FIRST_BATTLE_AFTERMATH_TARGETS[branchId] : null);
    const expectedTarget = branchId ? FIRST_BATTLE_AFTERMATH_TARGETS[branchId] : null;
    const outcomeKind = ["win", "lose", "interrupted"].includes(bridge.aftermathOutcomeKind)
      ? bridge.aftermathOutcomeKind
      : normalizeFirstBattleAftermathOutcome(bridge.aftermathOutcomeRaw);
    const copyGroup = branchId ? FIRST_BATTLE_AFTERMATH_DM_COPY[branchId] : null;
    const text = copyGroup && copyGroup[outcomeKind] ? copyGroup[outcomeKind] : null;
    if (!branchId || !targetNpcId || targetNpcId !== expectedTarget || !copyGroup || !text) return null;
    return {
      contactId: FIRST_BATTLE_AFTERMATH_DM_CONTACT_ID,
      followUpId: FIRST_BATTLE_AFTERMATH_DM_ID,
      targetNpcId,
      npcName: copyGroup.npcName,
      branchId,
      battleId: bridge.battleId,
      outcomeKind,
      dmStatus: bridge.aftermathDmStatus,
      lineId: bridge.aftermathDmLineId || `${FIRST_BATTLE_AFTERMATH_DM_ID}:${bridge.battleId || "battle"}:${targetNpcId}:${outcomeKind}`,
      text,
    };
  }

  function restoreFirstBattleAftermathDmHistory(targetNpcId) {
    const contact = getFirstBattleAftermathDmContactRecord();
    if (!contact || contact.dmStatus !== "delivered" || contact.targetNpcId !== targetNpcId) return false;
    if (!snapshot) snapshot = loadSnapshot();
    if (!snapshot) return false;
    ensureScenarioPlayers();
    const logs = getDmLogsForNpc(contact.targetNpcId);
    if (!logs) return false;
    const existing = logs.find((item) => item
      && item.stage7AftermathReplyId === contact.lineId);
    if (existing) return true;
    const UI = G.UI;
    if (!UI || typeof UI.dmPushLine !== "function") return false;
    UI.dmPushLine(contact.targetNpcId, contact.npcName, contact.text);
    const line = logs[logs.length - 1];
    if (!line) return false;
    line.stage7AftermathReplyId = contact.lineId;
    line.stage7AftermathFollowUpId = FIRST_BATTLE_AFTERMATH_DM_ID;
    line.stage7AftermathBattleId = contact.battleId;
    line.stage7AftermathBranchId = contact.branchId;
    line.stage7AftermathOutcomeKind = contact.outcomeKind;
    line.stage7AftermathHistoryRestored = true;
    telemetry("first_experience.first_real_battle_aftermath_dm_history_restored", {
      contactId: FIRST_BATTLE_AFTERMATH_DM_CONTACT_ID,
      lineId: contact.lineId,
      targetNpcId: contact.targetNpcId,
    });
    return true;
  }

  function openFirstBattleAftermathDmContact() {
    const contact = getFirstBattleAftermathDmContactRecord();
    if (!contact) return false;
    if (!snapshot) snapshot = loadSnapshot();
    if (!snapshot) return false;
    ensureScenarioPlayers();
    installFirstBattleAftermathDmHook();
    if (contact.dmStatus === "delivered") restoreFirstBattleAftermathDmHistory(contact.targetNpcId);
    const UI = G.UI;
    if (!UI || typeof UI.openDM !== "function") return false;
    const result = UI.openDM(contact.targetNpcId);
    if (result === false) return false;
    if (contact.dmStatus === "pending") deliverFirstBattleAftermathDm(contact.targetNpcId);
    telemetry("first_experience.first_real_battle_aftermath_dm_contact_opened", {
      contactId: FIRST_BATTLE_AFTERMATH_DM_CONTACT_ID,
      targetNpcId: contact.targetNpcId,
      dmStatus: contact.dmStatus,
    });
    render();
    return true;
  }

'''
              text = replace_once(
                  text,
                  '  function deliverFirstBattleAftermathDm(targetNpcId) {\n',
                  contact_logic + '  function deliverFirstBattleAftermathDm(targetNpcId) {\n',
                  "contact logic insertion",
              )

              contact_render = r'''
  function renderFirstBattleAftermathDmContact(panel) {
    const contact = getFirstBattleAftermathDmContactRecord();
    if (!contact) return false;
    const statusLine = contact.dmStatus === "pending"
      ? "Есть ответ после баттла. Он откроется только когда ты сам зайдёшь в переписку."
      : "Переписка после баттла сохранена. Можно вернуться к ней после обновления страницы.";
    panel.innerHTML = `
      <div class="stage7BranchFollowUp" data-stage7-aftermath-dm-contact="${contact.contactId}">
        <div class="stage7Badge">Личный контакт</div>
        <h2>${contact.npcName}</h2>
        <p>${statusLine}</p>
        ${actionButton("Открыть переписку", "open-aftermath-dm-contact")}
        <div class="stage7Support">Контакт переживает обновление страницы. Личка сама не откроется.</div>
      </div>`;
    return true;
  }

'''
              text = replace_once(
                  text,
                  '  function renderFirstBattleAftermath(panel) {\n',
                  contact_render + '  function renderFirstBattleAftermath(panel) {\n',
                  "contact render insertion",
              )

              old_render = '''      if (bridge && bridge.aftermathStatus === "pending") {
        releaseNormalWorldOnce({ preservePanel: true });
        panel.hidden = false;
        renderFirstBattleAftermath(panel);
        return;
      }
      panel.remove();
      releaseNormalWorldOnce();
      return;
'''
              new_render = '''      if (bridge && bridge.aftermathStatus === "pending") {
        releaseNormalWorldOnce({ preservePanel: true });
        panel.hidden = false;
        renderFirstBattleAftermath(panel);
        return;
      }
      const aftermathDmContact = getFirstBattleAftermathDmContactRecord();
      if (aftermathDmContact) {
        releaseNormalWorldOnce({ preservePanel: true });
        panel.hidden = false;
        renderFirstBattleAftermathDmContact(panel);
        return;
      }
      panel.remove();
      releaseNormalWorldOnce();
      return;
'''
              text = replace_once(text, old_render, new_render, "render contact branch")

              old_action = '''    } else if (action === "acknowledge-first-battle-aftermath" && snapshot.onboardingUnlocked) {
      acknowledgeFirstBattleAftermath();
    }
'''
              new_action = '''    } else if (action === "acknowledge-first-battle-aftermath" && snapshot.onboardingUnlocked) {
      acknowledgeFirstBattleAftermath();
    } else if (action === "open-aftermath-dm-contact" && snapshot.onboardingUnlocked) {
      openFirstBattleAftermathDmContact();
    }
'''
              text = replace_once(text, old_action, new_action, "contact action")

              resume_anchor = '''      if (bridge.status === "completed" && bridge.aftermathStatus === "pending") {
        snapshot = Object.assign(existing, { realBattleBridge: bridge });
        attach(nextContext);
        return {
          claimed: true,
          mode: "battle_aftermath_resume",
          stateId: snapshot.stateId,
          releaseNormalWorld: () => releaseNormalWorldOnce({ preservePanel: true }),
        };
      }
      return { claimed: false, mode: "complete", stateId: existing.stateId, releaseNormalWorld: () => {} };
'''
              resume_replacement = '''      if (bridge.status === "completed" && bridge.aftermathStatus === "pending") {
        snapshot = Object.assign(existing, { realBattleBridge: bridge });
        attach(nextContext);
        return {
          claimed: true,
          mode: "battle_aftermath_resume",
          stateId: snapshot.stateId,
          releaseNormalWorld: () => releaseNormalWorldOnce({ preservePanel: true }),
        };
      }
      if (bridge.status === "completed"
        && bridge.aftermathStatus === "acknowledged"
        && ["pending", "delivered"].includes(bridge.aftermathDmStatus)) {
        snapshot = Object.assign(existing, { realBattleBridge: bridge });
        attach(nextContext);
        return {
          claimed: true,
          mode: "battle_aftermath_dm_contact_resume",
          stateId: snapshot.stateId,
          releaseNormalWorld: () => releaseNormalWorldOnce({ preservePanel: true }),
        };
      }
      return { claimed: false, mode: "complete", stateId: existing.stateId, releaseNormalWorld: () => {} };
'''
              count = text.count(resume_anchor)
              if count != 2:
                  raise SystemExit(f"resume contact insertion: expected 2 matches, got {count}")
              text = text.replace(resume_anchor, resume_replacement)

              text = replace_once(
                  text,
                  '''    installFirstBattleAftermathDmHook,
    resetForDev,
''',
                  '''    installFirstBattleAftermathDmHook,
    getFirstBattleAftermathDmContactRecord,
    restoreFirstBattleAftermathDmHistory,
    openFirstBattleAftermathDmContact,
    resetForDev,
''',
                  "public exports",
              )
              text = replace_once(
                  text,
                  '''  G.__DEV.installStage7FirstBattleAftermathDmHook = installFirstBattleAftermathDmHook;
  G.__DEV.revealStage7HeldDenyEvidence = revealHeldDenyEvidence;
''',
                  '''  G.__DEV.installStage7FirstBattleAftermathDmHook = installFirstBattleAftermathDmHook;
  G.__DEV.getStage7FirstBattleAftermathDmContact = getFirstBattleAftermathDmContactRecord;
  G.__DEV.restoreStage7FirstBattleAftermathDmHistory = restoreFirstBattleAftermathDmHistory;
  G.__DEV.openStage7FirstBattleAftermathDmContact = openFirstBattleAftermathDmContact;
  G.__DEV.revealStage7HeldDenyEvidence = revealHeldDenyEvidence;
''',
                  "dev exports",
              )
              text = replace_once(text, '    stage: "7.13",\n', '    stage: "7.14",\n', "smoke stage")
              text = replace_once(
                  text,
                  '''    firstBattleAftermathDmRefreshSafe: true,
''',
                  '''    firstBattleAftermathDmRefreshSafe: true,
    firstBattleAftermathDmContactId: FIRST_BATTLE_AFTERMATH_DM_CONTACT_ID,
    firstBattleAftermathDmContactDurable: true,
    firstBattleAftermathDmContactNoAutoOpen: true,
    firstBattleAftermathDmDeliveredHistoryRestore: true,
''',
                  "smoke contact flags",
              )
              return text

          source = controllers[0].read_text(encoding="utf-8")
          docs = controllers[1].read_text(encoding="utf-8")
          if source != docs:
              raise SystemExit("controller mirrors differ before patch")
          patched = patch_controller(source)
          for path in controllers:
              path.write_text(patched, encoding="utf-8")

          indexes = [Path("AsyncScene/Web/index.html"), Path("docs/index.html")]
          index_source = indexes[0].read_text(encoding="utf-8")
          index_docs = indexes[1].read_text(encoding="utf-8")
          if index_source != index_docs:
              raise SystemExit("index mirrors differ before patch")
          old_marker = "stage7_13_aftermath_dm_followup_20260806c"
          new_marker = "stage7_14_durable_aftermath_dm_contact_20260807a"
          if index_source.count(old_marker) < 2:
              raise SystemExit("current Stage 7.13 cache marker missing")
          patched_index = index_source.replace(old_marker, new_marker)
          for path in indexes:
              path.write_text(patched_index, encoding="utf-8")
          PY

      - name: Validate Stage 7.14
        shell: bash
        run: |
          set -euo pipefail
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          python3 tools/test_stage7_14_durable_aftermath_dm_contact.py

          legacy_tests=(
            tools/test_stage7_7_preunlock_corridor.py
            tools/test_stage7_9_deny_evidence_payoff.py
            tools/test_stage7_10_accuse_ken_payoffs.py
            tools/test_stage7_11_pay_branch_payoffs.py
            tools/test_stage7_12_first_real_battle_aftermath.py
            tools/test_stage7_13_aftermath_dm_followup.py
            tools/test_stage7_first_causal_vertical_slice.py
            tools/test_stage7_observed_evidence_harness.py
          )
          for path in "${legacy_tests[@]}"; do
            sed -i 's/stage7_13_aftermath_dm_followup_20260806a/stage7_14_durable_aftermath_dm_contact_20260807a/g' "$path"
          done
          for path in "${legacy_tests[@]}"; do
            python3 "$path"
          done
          git checkout -- "${legacy_tests[@]}"

          cmp -s AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp -s AsyncScene/Web/index.html docs/index.html
          grep -Fq 'stage7_first_real_battle_dm_contact_v1' AsyncScene/Web/ui/ui-stage7-first-experience.js
          grep -Fq 'stage7_14_durable_aftermath_dm_contact_20260807a' docs/index.html

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/__temp_stage7_14_implementation.yml
          rm .github/workflows/__temp_stage7_14_implementation_v2.yml
          test "$(git status --short | wc -l | tr -d ' ')" = "7"
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: keep aftermath DM contact across refresh'
          git push origin HEAD:chatgpt/stage7-14-durable-aftermath-dm-contact-20260807
