name: tmp stage7 7 preunlock corridor

on:
  push:
    branches:
      - chatgpt/stage7-7-preunlock-corridor-20260805

permissions:
  contents: write

jobs:
  finalize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-7-preunlock-corridor-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align visible participant names
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('AsyncScene/Web/ui/ui-stage7-first-experience.js'),
              Path('docs/ui/ui-stage7-first-experience.js'),
          ]
          replacements = [
              ('Микой', 'Настей'),
              ('Мики', 'Насти'),
              ('Мику', 'Настю'),
              ('Мика', 'Настя'),
              ('Кеном', 'Райханом'),
              ('Кену', 'Райхану'),
              ('Кена', 'Райхана'),
              ('Кен', 'Райхан'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              if 'Кен' in text or 'Мика' in text:
                  raise SystemExit(f'old visible name remains in {path}')
              path.write_text(text, encoding='utf-8')
          print('STAGE7_7_VISIBLE_NAMES_ALIGNED')
          PY
      - name: Run focused regression
        run: python tools/test_stage7_7_preunlock_corridor.py
      - name: Validate focused diff
        run: |
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js "
          test "$actual" = "$expected"
      - name: Commit visible name alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          git commit -m 'fix: align visible Stage 7 participant names'
          git push
