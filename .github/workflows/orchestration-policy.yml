name: orchestration-policy

on:
  push:
    paths:
      - AGENTS.md
      - AGENTS.override.md
      - ORCHESTRATION.md
      - .ai-work/**
      - tools/validate-orchestration-policy.py
      - tools/validate_ai_work_pipeline.py
      - tools/test_validate_ai_work_pipeline.py
      - tools/test_validate_orchestration_policy.py
      - tools/repository_bridge_authority.py
      - tools/test_repository_bridge_authority.py
      - .github/workflows/orchestration-policy.yml
  pull_request:
    paths:
      - AGENTS.md
      - AGENTS.override.md
      - ORCHESTRATION.md
      - .ai-work/**
      - tools/validate-orchestration-policy.py
      - tools/validate_ai_work_pipeline.py
      - tools/test_validate_ai_work_pipeline.py
      - tools/test_validate_orchestration_policy.py
      - tools/repository_bridge_authority.py
      - tools/test_repository_bridge_authority.py
      - .github/workflows/orchestration-policy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository policy
        run: python3 tools/validate-orchestration-policy.py
      - name: Validate task artifact pipeline
        run: python3 -m unittest tools.test_validate_ai_work_pipeline tools.test_validate_orchestration_policy tools.test_repository_bridge_authority
      - name: Check patch whitespace
        run: git diff --check
