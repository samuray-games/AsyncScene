name: stage7-13-aftermath-dm-follow-up

on:
  push:
    branches:
      - chatgpt/stage7-13-aftermath-dm-follow-up-20260806

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-13-aftermath-dm-follow-up-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Stage 7.13 implementation
        run: python3 tools/tmp_stage7_13_aftermath_dm_follow_up.py
      - name: Validate exact scope and mirrors
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              'AsyncScene/Web/ui/ui-stage7-first-experience.js',
              'docs/ui/ui-stage7-first-experience.js',
              'AsyncScene/Web/ui/ui-dm.js',
              'docs/ui/ui-dm.js',
              'AsyncScene/Web/index.html',
              'docs/index.html',
              'tools/test_stage7_13_aftermath_dm_follow_up.py',
              'tools/test_stage7_12_first_real_battle_aftermath.py',
              'tools/test_stage7_11_pay_branch_payoffs.py',
              'tools/test_stage7_10_accuse_ken_payoffs.py',
              'tools/test_stage7_9_deny_evidence_payoff.py',
              'tools/test_stage7_7_preunlock_corridor.py',
              'tools/test_stage7_first_causal_vertical_slice.py',
              'tools/test_stage7_observed_evidence_harness.py',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          changed = tracked | untracked
          if changed != expected:
              raise SystemExit(f'exact scope mismatch: changed={sorted(changed)} expected={sorted(expected)}')
          assert Path('AsyncScene/Web/ui/ui-stage7-first-experience.js').read_bytes() == Path('docs/ui/ui-stage7-first-experience.js').read_bytes()
          assert Path('AsyncScene/Web/ui/ui-dm.js').read_bytes() == Path('docs/ui/ui-dm.js').read_bytes()
          assert Path('AsyncScene/Web/index.html').read_bytes() == Path('docs/index.html').read_bytes()
          forbidden = {'TASKS.md', 'PROJECT_MEMORY.md', '.ai-memory/CURRENT.md', '.ai-memory/CANON.md', '.ai-memory/WORKFLOWS.md'}
          assert not (changed & forbidden)
          print('STAGE7_13_EXACT_SCOPE_AND_MIRRORS_OK')
          PY
      - name: Run Stage 7.13 focused and current regression matrix
        run: |
          python3 tools/test_stage7_13_aftermath_dm_follow_up.py
          python3 tools/test_stage7_12_first_real_battle_aftermath.py
          python3 tools/test_stage7_11_pay_branch_payoffs.py
          python3 tools/test_stage7_10_accuse_ken_payoffs.py
          python3 tools/test_stage7_9_deny_evidence_payoff.py
          python3 tools/test_stage7_7_preunlock_corridor.py
          python3 tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_observed_evidence_harness.py
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check AsyncScene/Web/ui/ui-dm.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AsyncScene/Web/ui/ui-stage7-first-experience.js \
            docs/ui/ui-stage7-first-experience.js \
            AsyncScene/Web/ui/ui-dm.js \
            docs/ui/ui-dm.js \
            AsyncScene/Web/index.html \
            docs/index.html \
            tools/test_stage7_13_aftermath_dm_follow_up.py \
            tools/test_stage7_12_first_real_battle_aftermath.py \
            tools/test_stage7_11_pay_branch_payoffs.py \
            tools/test_stage7_10_accuse_ken_payoffs.py \
            tools/test_stage7_9_deny_evidence_payoff.py \
            tools/test_stage7_7_preunlock_corridor.py \
            tools/test_stage7_first_causal_vertical_slice.py \
            tools/test_stage7_observed_evidence_harness.py
          git commit -m 'feat: make first battle aftermath affect target DM'
          git push origin HEAD:chatgpt/stage7-13-aftermath-dm-follow-up-20260806
