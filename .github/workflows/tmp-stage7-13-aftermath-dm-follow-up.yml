name: stage7-13-aftermath-dm-follow-up

on:
  push:
    branches:
      - chatgpt/stage7-13-aftermath-dm-follow-up-20260806

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-13-aftermath-dm-follow-up-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Stage 7.13 implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/tmp_stage7_13_aftermath_dm_follow_up.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          opener = "    return r'''from pathlib import Path"
          opener_hits = [i for i, line in enumerate(lines) if line == opener]
          if len(opener_hits) != 1:
              raise SystemExit(f'outer test opener count: {len(opener_hits)}')
          lines[opener_hits[0]] = '    return r"""from pathlib import Path'
          print_hits = [i for i, line in enumerate(lines) if line == 'print("STAGE7_13_AFTERMATH_DM_FOLLOW_UP_OK")']
          if len(print_hits) != 1:
              raise SystemExit(f'test terminal marker count: {len(print_hits)}')
          close_index = print_hits[0] + 1
          if close_index >= len(lines) or lines[close_index] != "'''":
              raise SystemExit('outer test closer not found after terminal marker')
          lines[close_index] = '"""'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 tools/tmp_stage7_13_aftermath_dm_follow_up.py
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('AsyncScene/Web/ui/ui-stage7-first-experience.js'), Path('docs/ui/ui-stage7-first-experience.js')]
          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              fn = lines.index('  function consumeFirstBattleAftermathDmReply(targetNpcId) {')
              bridge = lines.index('    const bridge = getBridgeState();', fn)
              target = lines.index('    const targetId = String(targetNpcId || "");', bridge)
              cond = lines.index('    if (!bridge', target)
              cond_end = next(i for i in range(cond, len(lines)) if lines[i].endswith('return null;'))
              record = lines.index('    const record = getFirstBattleAftermathRecord();', cond_end)
              record_guard = lines.index('    if (!record || record.targetNpcId !== targetId || !record.dmReply) return null;', record)
              if not (bridge < target < cond <= cond_end < record < record_guard):
                  raise SystemExit(f'unexpected consume ordering in {path}')
              condition = lines[cond:cond_end + 1]
              condition[-1] = '      || targetId !== bridge.aftermathTargetNpcId'
              condition.extend(['      || !record', '      || record.targetNpcId !== targetId', '      || !record.dmReply) return null;'])
              replacement = ['    const targetId = String(targetNpcId || "");', '    const record = getFirstBattleAftermathRecord();', '    const bridge = getBridgeState();'] + condition
              lines[bridge:record_guard + 1] = replacement
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test_stage7_first_causal_vertical_slice.py')
          text = path.read_text(encoding='utf-8')
          old = 'require(index.count(cache_token) == 2, "expected current JS and CSS cache-buster references")'
          new = 'require(index.count(cache_token) == 3, "expected current CSS, controller and DM cache-buster references")\nrequire(f\'ui/ui-dm.js?v={cache_token}\' in index, "DM must share the current Stage 7 cache-buster")'
          if text.count(old) != 1:
              raise SystemExit(f'cache ownership count anchor: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git checkout -- tools/tmp_stage7_13_aftermath_dm_follow_up.py
      - name: Validate exact scope and mirrors
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {
              'AsyncScene/Web/ui/ui-stage7-first-experience.js', 'docs/ui/ui-stage7-first-experience.js',
              'AsyncScene/Web/ui/ui-dm.js', 'docs/ui/ui-dm.js',
              'AsyncScene/Web/index.html', 'docs/index.html',
              'tools/test_stage7_13_aftermath_dm_follow_up.py', 'tools/test_stage7_12_first_real_battle_aftermath.py',
              'tools/test_stage7_11_pay_branch_payoffs.py', 'tools/test_stage7_10_accuse_ken_payoffs.py',
              'tools/test_stage7_9_deny_evidence_payoff.py', 'tools/test_stage7_7_preunlock_corridor.py',
              'tools/test_stage7_first_causal_vertical_slice.py', 'tools/test_stage7_observed_evidence_harness.py',
          }
          tracked = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          changed = tracked | untracked
          if changed != expected:
              raise SystemExit(f'exact scope mismatch: changed={sorted(changed)} expected={sorted(expected)}')
          assert Path('AsyncScene/Web/ui/ui-stage7-first-experience.js').read_bytes() == Path('docs/ui/ui-stage7-first-experience.js').read_bytes()
          assert Path('AsyncScene/Web/ui/ui-dm.js').read_bytes() == Path('docs/ui/ui-dm.js').read_bytes()
          assert Path('AsyncScene/Web/index.html').read_bytes() == Path('docs/index.html').read_bytes()
          forbidden = {'TASKS.md', 'PROJECT_MEMORY.md', '.ai-memory/CURRENT.md', '.ai-memory/CANON.md', '.ai-memory/WORKFLOWS.md'}
          assert not (changed & forbidden)
          print('STAGE7_13_EXACT_SCOPE_AND_MIRRORS_OK')
          PY
      - name: Run Stage 7.13 focused and current regression matrix
        run: |
          python3 tools/test_stage7_13_aftermath_dm_follow_up.py
          python3 tools/test_stage7_12_first_real_battle_aftermath.py
          python3 tools/test_stage7_11_pay_branch_payoffs.py
          python3 tools/test_stage7_10_accuse_ken_payoffs.py
          python3 tools/test_stage7_9_deny_evidence_payoff.py
          python3 tools/test_stage7_7_preunlock_corridor.py
          python3 tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_observed_evidence_harness.py
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check AsyncScene/Web/ui/ui-dm.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js AsyncScene/Web/ui/ui-dm.js docs/ui/ui-dm.js AsyncScene/Web/index.html docs/index.html tools/test_stage7_13_aftermath_dm_follow_up.py tools/test_stage7_12_first_real_battle_aftermath.py tools/test_stage7_11_pay_branch_payoffs.py tools/test_stage7_10_accuse_ken_payoffs.py tools/test_stage7_9_deny_evidence_payoff.py tools/test_stage7_7_preunlock_corridor.py tools/test_stage7_first_causal_vertical_slice.py tools/test_stage7_observed_evidence_harness.py
          git commit -m 'feat: make first battle aftermath affect target DM'
          git push origin HEAD:chatgpt/stage7-13-aftermath-dm-follow-up-20260806
