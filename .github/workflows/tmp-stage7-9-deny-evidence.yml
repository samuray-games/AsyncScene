name: stage7-9-deny-evidence

on:
  push:
    branches:
      - chatgpt/stage7-9-deny-evidence-payoff-20260806

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-9-deny-evidence-payoff-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply Stage 7.9 implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/tmp_stage7_9_deny_evidence_patch.py")
          text = path.read_text(encoding="utf-8")
          old_open = "TEST = r'''from pathlib"
          new_open = 'TEST = r"""from pathlib'
          old_close = 'print("STAGE7_9_DENY_EVIDENCE_PAYOFF_OK")\n\'\'\'\nPath("tools/test_stage7_9_deny_evidence_payoff.py")'
          new_close = 'print("STAGE7_9_DENY_EVIDENCE_PAYOFF_OK")\n"""\nPath("tools/test_stage7_9_deny_evidence_payoff.py")'
          old_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
    count = text.count(old)
    if count != 1:
        raise SystemExit(f"{label}: expected one match, found {count}")
    return text.replace(old, new, 1)
'''
          new_helper = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
    count = text.count(old)
    if label == "controller active resume payoff":
        if count < 1:
            raise SystemExit(f"{label}: expected at least one match, found {count}")
        return text.replace(old, new, 1)
    if count != 1:
        raise SystemExit(f"{label}: expected one match, found {count}")
    return text.replace(old, new, 1)
'''
          if text.count(old_open) != 1 or text.count(old_close) != 1 or text.count(old_helper) != 1:
              raise SystemExit("temporary patch repair anchors changed")
          text = text.replace(old_open, new_open, 1).replace(old_close, new_close, 1).replace(old_helper, new_helper, 1)
          path.write_text(text, encoding="utf-8")
          PY
          set +e
          output="$(python tools/tmp_stage7_9_deny_evidence_patch.py 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Stage 7.9 patch failed::$output"
            exit "$status"
          fi
      - name: Validate runtime mirrors and syntax
        run: |
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          node --check AsyncScene/Web/ui/ui-battles.js
          node --check docs/ui/ui-battles.js
          cmp AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/ui/ui-battles.js docs/ui/ui-battles.js
          cmp AsyncScene/Web/index.html docs/index.html
          git diff --check
      - name: Run focused and Stage 7 regression matrix
        run: |
          python tools/test_stage7_9_deny_evidence_payoff.py
          python tools/test_stage7_first_causal_vertical_slice.py
          python tools/test_stage7_observed_evidence_harness.py
          python tools/test_stage7_4_personalization.py
          python tools/test_stage7_essence_modal.py
          python tools/test_stage7_essence_prestart_overlay.py
          python tools/test_stage7_7_preunlock_corridor.py
      - name: Enforce boundary and exact final scope
        run: |
          ! grep -E '\b(fetch|XMLHttpRequest|sendBeacon|WebSocket)\b' AsyncScene/Web/ui/ui-stage7-first-experience.js
          rm tools/tmp_stage7_9_deny_evidence_patch.py
          rm .github/workflows/tmp-stage7-9-deny-evidence.yml
          git fetch origin main
          actual="$(git diff --name-only origin/main | sort)"
          expected="$(printf '%s\n' \
            'AsyncScene/Web/index.html' \
            'AsyncScene/Web/ui/ui-battles.js' \
            'AsyncScene/Web/ui/ui-stage7-first-experience.js' \
            'docs/index.html' \
            'docs/ui/ui-battles.js' \
            'docs/ui/ui-stage7-first-experience.js' \
            'tools/test_stage7_7_preunlock_corridor.py' \
            'tools/test_stage7_9_deny_evidence_payoff.py' \
            'tools/test_stage7_first_causal_vertical_slice.py' \
            'tools/test_stage7_observed_evidence_harness.py')"
          test "$actual" = "$expected"
          test "$(printf '%s\n' "$actual" | grep -E '(^|/)(conflict-core|conflict-api|conflict-economy|conflict-arguments|economy|system|data)\.js$' || true)" = ""
          git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: make deny evidence matter in first battle"
          git push origin HEAD:chatgpt/stage7-9-deny-evidence-payoff-20260806
