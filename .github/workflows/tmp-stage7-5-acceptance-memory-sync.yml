name: tmp stage7 5 acceptance memory sync

on:
  push:
    branches:
      - chatgpt/stage7-5-acceptance-memory-sync-20260805
    paths:
      - tools/tmp_stage7_5_acceptance_memory_sync.py
      - .github/workflows/tmp-stage7-5-acceptance-memory-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch compact memory
        run: python3 tools/tmp_stage7_5_acceptance_memory_sync.py
      - name: Validate exact scope and revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {
              'PROJECT_MEMORY.md',
              '.ai-memory/CURRENT.md',
              '.ai-memory/CANON.md',
              '.ai-memory/WORKFLOWS.md',
          }
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'bad scope: {sorted(changed)}')
          for path in expected:
              text = Path(path).read_text(encoding='utf-8')
              if '2026-08-05-1924-JST' not in text:
                  raise SystemExit(f'missing revision in {path}')
              if 'STAGE7_6_VISIBLE_LATER_REACTION' not in text:
                  raise SystemExit(f'missing next task in {path}')
          subprocess.check_call(['git', 'diff', '--check'])
          print('MEMORY_SCOPE_OK')
          PY
      - name: Commit synchronized memory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_MEMORY.md .ai-memory/CURRENT.md .ai-memory/CANON.md .ai-memory/WORKFLOWS.md
          git commit -m "docs: record accepted Stage 7.5 Safari gate"
          git push origin HEAD
