name: tmp stage7 6 visible later reaction

on:
  push:
    branches:
      - chatgpt/stage7-6-visible-later-reaction-20260805
    paths:
      - tools/tmp_stage7_6_visible_later_reaction_patch.py
      - tools/test_stage7_6_visible_follow_up_reaction.py
      - .github/workflows/tmp-stage7-6-visible-later-reaction.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Stage 7.6 runtime patch
        run: python3 tools/tmp_stage7_6_visible_later_reaction_patch.py
      - name: Run focused Stage 7.6 regression
        run: python3 tools/test_stage7_6_visible_follow_up_reaction.py
      - name: Validate exact runtime scope
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
              'AsyncScene/Web/ui/ui-stage7-first-experience.js',
              'docs/ui/ui-stage7-first-experience.js',
              'AsyncScene/Web/index.html',
              'docs/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'bad runtime scope: {sorted(changed)}')
          subprocess.check_call(['git', 'diff', '--check'])
          print('STAGE7_6_RUNTIME_SCOPE_OK')
          PY
      - name: Commit Stage 7.6 runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js AsyncScene/Web/index.html docs/index.html
          git commit -m "feat: show later reaction to Stage 7 follow-up"
          git push origin HEAD
