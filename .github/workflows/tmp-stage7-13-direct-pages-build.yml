name: stage7-13-direct-pages-build

on:
  push:
    branches:
      - chatgpt/stage7-13-direct-pages-build-20260806

permissions:
  contents: read
  pages: write

jobs:
  trigger-direct-build:
    runs-on: ubuntu-latest
    steps:
      - name: Request legacy Pages build for current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/samuray-games/AsyncScene/pages/builds
          echo "STAGE7_13_DIRECT_PAGES_BUILD_REQUESTED"
