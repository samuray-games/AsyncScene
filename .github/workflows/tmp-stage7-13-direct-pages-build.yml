name: stage7-13-exact-docs-pages-recovery

on:
  push:
    branches:
      - chatgpt/stage7-13-direct-pages-build-20260806

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stage7-13-pages-recovery
  cancel-in-progress: false

jobs:
  deploy-exact-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployment carrier
        uses: actions/checkout@v4
        with:
          ref: c26f29ab42c9215c2c9f2ee05278b8ba0946d036
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload exact docs artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy exact docs with extended queue tolerance
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
          reporting_interval: 10000
          error_count: 50
