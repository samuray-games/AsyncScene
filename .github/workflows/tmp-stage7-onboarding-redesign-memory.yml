name: tmp stage7 onboarding redesign memory

on:
  push:
    branches:
      - chatgpt/stage7-onboarding-redesign-memory-20260805

permissions:
  contents: write

jobs:
  patch-memory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-onboarding-redesign-memory-20260805
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch compact memory
        run: python tools/tmp_stage7_onboarding_redesign_memory_sync.py
      - name: Validate exact scope and revisions
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".ai-memory/CANON.md .ai-memory/CURRENT.md .ai-memory/WORKFLOWS.md PROJECT_MEMORY.md "
          grep -q '2026-08-05-2229-JST' PROJECT_MEMORY.md
          grep -q 'IMPLEMENT_STAGE7_7_LOCKED_THREE_NPC_INTERMISSION_AND_SECOND_ROUND_TRIGGER' .ai-memory/WORKFLOWS.md
      - name: Commit generated memory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PROJECT_MEMORY.md .ai-memory/CURRENT.md .ai-memory/CANON.md .ai-memory/WORKFLOWS.md
          git commit -m 'docs: record superseding Stage 7 onboarding flow'
          git push
