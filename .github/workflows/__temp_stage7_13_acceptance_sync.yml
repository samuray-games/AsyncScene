name: TEMP Stage7.13 acceptance memory sync

on:
  push:
    branches:
      - chatgpt/stage7-13-acceptance-sync-20260807

permissions:
  contents: write

jobs:
  sync-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-13-acceptance-sync-20260807
          fetch-depth: 0
      - name: Synchronize accepted memory
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '...snip...' | base64 -d > /tmp/sync.py
          python3 /tmp/sync.py

          test "$(git status --short | wc -l | tr -d ' ')" = "6"
          git status --short | grep -Fq ' M .ai-memory/CANON.md'
          git status --short | grep -Fq ' M .ai-memory/CURRENT.md'
          git status --short | grep -Fq ' M .ai-memory/WORKFLOWS.md'
          git status --short | grep -Fq ' M PROJECT_MEMORY.md'
          git status --short | grep -Fq ' M TASKS.md'
          git status --short | grep -Fq ' D .github/workflows/__temp_stage7_13_acceptance_sync.yml'

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: record accepted Stage 7.13 and select 7.14'
          git push origin HEAD:chatgpt/stage7-13-acceptance-sync-20260807
