name: tmp stage7 8 active resume

on:
  push:
    branches:
      - chatgpt/stage7-8-real-argument-battle-20260806

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-8-real-argument-battle-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply active-resume lifecycle fix
        run: python tools/tmp_stage7_8_active_resume_fix.py
      - name: Run full Stage 7 matrix
        run: |
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/index.html docs/index.html
          python tools/test_stage7_first_causal_vertical_slice.py
          python tools/test_stage7_observed_evidence_harness.py
          python tools/test_stage7_4_personalization.py
          python tools/test_stage7_essence_modal.py
          python tools/test_stage7_essence_prestart_overlay.py
          python tools/test_stage7_7_preunlock_corridor.py
          git diff --check
      - name: Validate generated scope
        run: |
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js tools/test_stage7_7_preunlock_corridor.py "
          test "$actual" = "$expected"
      - name: Commit active-resume fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js tools/test_stage7_7_preunlock_corridor.py
          git commit -m 'fix: track active Stage 7 battle across resume'
          git push
