name: stage7-13-aftermath-dm-followup

on:
  push:
    branches:
      - chatgpt/stage7-13-aftermath-dm-followup-20260806

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-13-aftermath-dm-followup-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Stage 7.13 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/tmp_stage7_13_aftermath_dm_followup.py')
          text = path.read_text(encoding='utf-8')
          old_start = "node_harness = r'''"
          old_end = "\n'''\n\nwith tempfile.NamedTemporaryFile"
          if text.count(old_start) != 1 or text.count(old_end) != 1:
              raise SystemExit('nested harness delimiter anchors changed')
          text = text.replace(old_start, 'node_harness = r"""', 1)
          text = text.replace(old_end, '\n"""\n\nwith tempfile.NamedTemporaryFile', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/tmp_stage7_13_aftermath_dm_followup.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test_stage7_13_aftermath_dm_followup.py')
          text = path.read_text(encoding='utf-8')
          old = '''assert.strictEqual(prepared.dev.acknowledgeStage7FirstBattleAftermath(), true);
const entries = Array.from(legacySource.storage.entries());'''
          new = '''assert.strictEqual(prepared.dev.acknowledgeStage7FirstBattleAftermath(), true);
prepared.G.Stage7FirstExperience.destroy();
const entries = Array.from(legacySource.storage.entries());'''
          if text.count(old) != 1:
              raise SystemExit('legacy scheduler cleanup anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git checkout -- tools/tmp_stage7_13_aftermath_dm_followup.py
      - name: Run focused and current Stage 7 regression matrix
        run: |
          python3 tools/test_stage7_13_aftermath_dm_followup.py
          python3 tools/test_stage7_12_first_real_battle_aftermath.py
          python3 tools/test_stage7_11_pay_branch_payoffs.py
          python3 tools/test_stage7_10_accuse_ken_payoffs.py
          python3 tools/test_stage7_9_deny_evidence_payoff.py
          python3 tools/test_stage7_7_preunlock_corridor.py
          python3 tools/test_stage7_first_causal_vertical_slice.py
          python3 tools/test_stage7_observed_evidence_harness.py
      - name: Validate mirrors boundaries and exact scope
        run: |
          node --check AsyncScene/Web/ui/ui-stage7-first-experience.js
          node --check docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js
          cmp AsyncScene/Web/index.html docs/index.html
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          expected = {
              'AsyncScene/Web/ui/ui-stage7-first-experience.js', 'docs/ui/ui-stage7-first-experience.js',
              'AsyncScene/Web/index.html', 'docs/index.html',
              'tools/test_stage7_7_preunlock_corridor.py', 'tools/test_stage7_9_deny_evidence_payoff.py',
              'tools/test_stage7_10_accuse_ken_payoffs.py', 'tools/test_stage7_11_pay_branch_payoffs.py',
              'tools/test_stage7_12_first_real_battle_aftermath.py', 'tools/test_stage7_13_aftermath_dm_followup.py',
              'tools/test_stage7_first_causal_vertical_slice.py', 'tools/test_stage7_observed_evidence_harness.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'exact scope mismatch: changed={sorted(changed)} expected={sorted(expected)}')
          forbidden = ('AsyncScene/Web/conflict/', 'docs/conflict/', 'AsyncScene/Web/state.js', 'docs/state.js',
              'AsyncScene/Web/data.js', 'docs/data.js', 'AsyncScene/Web/system.js', 'docs/system.js',
              'AsyncScene/Web/ui/ui-dm.js', 'docs/ui/ui-dm.js')
          bad = [path for path in changed if path.startswith(forbidden)]
          if bad:
              raise SystemExit(f'protected boundary touched: {bad}')
          source = Path('AsyncScene/Web/ui/ui-stage7-first-experience.js').read_text(encoding='utf-8')
          for token in ('fetch(', 'XMLHttpRequest', 'sendBeacon', 'WebSocket'):
              if token in source:
                  raise SystemExit(f'network primitive forbidden: {token}')
          index = Path('AsyncScene/Web/index.html').read_text(encoding='utf-8')
          for marker in ('stage7_first_real_battle_dm_followup_v1', 'aftermathDmStatus',
              'installFirstBattleAftermathDmHook', 'first_real_battle_aftermath_dm_delivered'):
              if marker not in source:
                  raise SystemExit(f'missing Stage 7.13 source marker: {marker}')
          if 'stage7_13_aftermath_dm_followup_20260806a' not in index:
              raise SystemExit('missing Stage 7.13 cache marker')
          print('STAGE7_13_EXACT_SCOPE_AND_BOUNDARIES_OK')
          PY
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AsyncScene/Web/ui/ui-stage7-first-experience.js docs/ui/ui-stage7-first-experience.js AsyncScene/Web/index.html docs/index.html tools/test_stage7_7_preunlock_corridor.py tools/test_stage7_9_deny_evidence_payoff.py tools/test_stage7_10_accuse_ken_payoffs.py tools/test_stage7_11_pay_branch_payoffs.py tools/test_stage7_12_first_real_battle_aftermath.py tools/test_stage7_13_aftermath_dm_followup.py tools/test_stage7_first_causal_vertical_slice.py tools/test_stage7_observed_evidence_harness.py
          git commit -m 'feat: carry first battle aftermath into DM'
          git push origin HEAD:chatgpt/stage7-13-aftermath-dm-followup-20260806
