name: stage7-11-pass-memory-sync

on:
  push:
    branches:
      - chatgpt/stage7-11-pass-stage7-12-selection-20260806

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-11-pass-stage7-12-selection-20260806
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply accepted Stage 7.11 memory patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/tmp_stage7_11_pass_memory_patch.py')
          source = path.read_text(encoding='utf-8')
          task_anchor = "section = f'''## 2026-08-06 - Stage 7.11 pay payoff Safari acceptance\n"
          task_replacement = task_anchor + "- Memory revision: `{REV}`.\n"
          if source.count(task_anchor) != 1:
              raise SystemExit('task revision injection anchor mismatch')
          source = source.replace(task_anchor, task_replacement, 1)
          canon_anchor = 'write(path, text)\n\n# .ai-memory/WORKFLOWS.md'
          canon_replacement = 'text += f"\\nNEXT_ACTION: {NEXT}\\n"\nwrite(path, text)\n\n# .ai-memory/WORKFLOWS.md'
          if source.count(canon_anchor) != 1:
              raise SystemExit('canon next-action injection anchor mismatch')
          source = source.replace(canon_anchor, canon_replacement, 1)
          exec(compile(source, str(path), 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate exact five-file scope
        run: |
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
            'TASKS.md',
            'PROJECT_MEMORY.md',
            '.ai-memory/CURRENT.md',
            '.ai-memory/CANON.md',
            '.ai-memory/WORKFLOWS.md',
          }
          if changed != expected:
            raise SystemExit(f'exact scope mismatch\nchanged={sorted(changed)}\nexpected={sorted(expected)}')
          for path in expected:
            text = open(path, encoding='utf-8').read()
            assert '2026-08-06-1818-JST' in text, path
            assert 'IMPLEMENT_STAGE7_12_FIRST_REAL_BATTLE_AFTERMATH_CONSEQUENCE' in text, path
          print('STAGE7_11_PASS_MEMORY_SCOPE_OK', sorted(changed))
          PY
          git diff --check
      - name: Commit memory synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TASKS.md PROJECT_MEMORY.md .ai-memory/CURRENT.md .ai-memory/CANON.md .ai-memory/WORKFLOWS.md
          git commit -m 'docs: record accepted Stage 7.11 payoff'
          git push origin HEAD:chatgpt/stage7-11-pass-stage7-12-selection-20260806
